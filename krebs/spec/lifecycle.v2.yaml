# Krebs lifecycle v2: the one ticket lifecycle for every 33GOD board.
#
# Owner decisions (Jarad, 2026-11-14):
#   1. Every board uses Plane's standard five lanes. The nine-lane layout is retired;
#      what the extra lanes meant now lives in labels.
#   2. Todo entry dispatches triage. Triage done = +lifecycle:triaged, -agent:working.
#      On each beat the PM keeps two implementation slots per project filled from
#      triaged Todo tickets, until nothing is left or the rest wait on a person.
#   3. Krebs is the name of this spec and of the state manager that enforces it.
#      It retires Momo (a skill that drove the lifecycle by prompt).
#   5. An epic in In Progress takes a slot like any other ticket (Krebs never
#      dispatches an epic; whoever starts one spends a slot on it).
#   6. (2026-11-18, 33GOD-93) A ticket nobody is working on never holds a slot or
#      agent:working. Krebs asks Candystore whether a turn is live; if not, it
#      releases the ticket to Todo or removes the stale label (see `orphans`).
#   7. (2026-11-18) The PM gives the verdict. Launch Directors are retired; a PM in
#      launch mode drives a launch. Krebs sends the scope's PM a review turn for
#      every handed-back ticket (see `catch_up.review`).
#   8. (2026-11-18) lifecycle:human is the owner's emergency hold: the owner took
#      the ticket by hand. Nothing automated dispatches, triages, reviews,
#      releases or relabels it, and agents never add or remove it.
#   9. (2026-11-18, ADR 0001) Krebs is the one triage sender. The n8n Ticket
#      Triage lane is retired; the gateway publishes agent.invocation.queued when
#      it claims a command, so every queued turn is visible whoever sent it.
#  10. (2026-11-20, ADR 0002) Krebs also runs on events: a Plane edit or a finished agent turn
#      starts a board-scoped tick (`krebs watch`); Candybar's 10-minute tick stays as the backstop.
#      Because runs no longer happen one per 10 minutes, a scope may hold at most ONE board turn
#      (triage or review, any ticket) queued or running at a time, enforced by the tick against
#      Candystore, and the triage quiet window drops from 10 minutes to 2.
#
# Human-readable companion: ../docs/lifecycle.md.
spec_version: 2.4.0

lanes:                       # exact Plane state names; order is the board order
  - {name: Backlog,     group: backlog,   default: true}
  - {name: Todo,        group: unstarted}
  - {name: In Progress, group: started}
  - {name: Done,        group: completed}
  - {name: Cancelled,   group: cancelled}
# Plane's hidden intake state (group: triage) is left alone; it is not a lane.

labels:                      # lifecycle labels; every board carries all seven
  agent:working:
    meaning: an agent turn is running on this ticket right now
    set_by: [pickup-chip, krebs-dispatch, px claim]
    cleared_by: [pickup-chip at turn end, krebs orphans sweep (no live turn), px release/close/cancel]
    agents_touch: never      # agents never add or remove it themselves
  lifecycle:triaged:
    meaning: triage finished; the ticket is ready for an implementation slot
    set_by: [the triage turn, as its last action, only when it finished]
    cleared_by: [owner or PM, when the ticket must be re-triaged]
  lifecycle:review:
    meaning: implementation handed back; waiting for a verdict
    only_in: In Progress
    set_by: [implementation turn, on handback, when the scope requires review]
    cleared_by: [krebs (outside In Progress), the PM's verdict (close or SENT BACK)]
  lifecycle:needs-input:
    meaning: waiting on a person (human in the loop); the question is in a comment
    set_by: [any turn that needs an answer]
    cleared_by: [the person who answers, or the PM relaying the answer]
  lifecycle:blocked:
    meaning: waiting on another ticket or an external thing (record the blocker as a Plane relation)
    set_by: [any turn]
    cleared_by: [whoever clears the blocker]
  agent:failed:
    meaning: an agent turn on this ticket failed and nobody has looked yet
    set_by: [lane errors]
    cleared_by: [the person or PM who looked]
  lifecycle:human:
    meaning: the owner took this ticket by hand (emergency hold); automation leaves it alone
    set_by: [owner only]
    cleared_by: [owner only]
    agents_touch: never      # no agent, chip, krebs repair or px write adds or removes it

# Labels that take a ticket out of the flow: never dispatched, never hold a slot.
hold_labels: [lifecycle:needs-input, lifecycle:blocked, agent:failed, lifecycle:human]
# Labels that make a ticket non-dispatchable work containers.
container_labels: [epic, "epic:*"]

slots:
  unit: scope                # one owner per scope: a registry row (board, or board + scope_label)
  default: 2                 # override per row: agents-registry.yaml plane.wip
  occupied_by: In Progress AND NOT lifecycle:review AND NOT any hold_label   # epics included (owner decision 5)
  over_limit: drain          # Krebs never evicts; it dispatches nothing until a slot frees

transitions:
  - id: intake
    to: Backlog
    by: anyone (px task create; default lane)
  - id: accept
    from: Backlog
    to: Todo
    by: [PM pass, director, owner]
  - id: triage
    trigger: Todo entry, or created in Todo
    unless: [lifecycle:triaged, any hold_label]   # SENT BACK / release re-entries skip triage
    does: krebs tick sends a triage turn to the scope owner (catch_up.triage; the n8n Ticket Triage lane is retired, ADR 0001); chip sets agent:working
    ends_with:                                    # exactly one of
      - +lifecycle:triaged when finished           # chip clears agent:working at turn end
      - +lifecycle:needs-input with the question as a comment
    never: change state, split, or start the work
  - id: dispatch
    from: Todo
    to: In Progress
    by: krebs tick (the only dispatcher)
    guard: free slot in scope AND lifecycle:triaged AND NOT agent:working AND NOT hold_label AND NOT container_label AND no open blocking relation
    order: [Plane sort_order (the PM's Todo order), priority, sequence_id]
    does: one write sets In Progress + agent:working + start_date, then publishes bloodbank.agent.invocation.start (reason ticket-delegation) to the scope owner
  - id: handback
    in: In Progress
    by: implementation turn
    review_required: +lifecycle:review and an evidence comment   # scope has a verdict giver (registry plane.review true)
    no_review: close (Done) with evidence comment
  - id: hold
    in: [Todo, In Progress]
    by: any turn
    does: +lifecycle:needs-input or +lifecycle:blocked and a comment saying what it waits on; the lane does not change
  - id: verdict
    in: In Progress + lifecycle:review
    by: the scope's PM (the verdict giver; Launch Directors are retired), in a krebs review turn or its own pass
    accepted: 'px close <ref> -m "<reason>" (Done)'
    sent_back: 'px release <ref> -m "returned: <criterion>": back to Todo; it keeps lifecycle:triaged and waits for a slot'
    needs_person: 'px attention <ref> -m "<question>"'
    never: the implementer reviewing its own work
  - id: park
    from: [Todo, In Progress]
    to: Backlog
    by: [PM pass, owner]
  - id: cancel
    to: Cancelled
    by: [PM pass, owner]

invariants:                  # Krebs repairs these on every tick
  - lifecycle:review only on In Progress tickets (removed elsewhere)
  - agent:working never on Done or Cancelled tickets
  - agent:working only while an agent turn is live (see orphans)
  - a slot is only held by a ticket with a live turn (see orphans)

orphans:                     # 33GOD-93: turns that ended with no handback and no hold
  liveness:
    source: Candystore GET /events (local, http://127.0.0.1:8683; KREBS_CANDYSTORE_URL)
    key: the ticket correlation id, fleet.ticketCorrelationId(board, ticket), which every dispatch and triage command carries
    live_when:               # any one of these
      - krebs published a dispatch (triage, review) command for it under 8 (3) hours ago and no .completed/.failed for that command is on record (bridges the moment between publish and the gateway's claim)
      - an agent.invocation.queued with no .started/.completed/.failed, queued under 8 hours ago (3 for ticket-grooming and ticket-review), whoever sent it; the gateway publishes it when it durably claims a command, and .started only once the turn gets a slot (queues up to 55 min measured)
      - an agent.invocation.started with no .completed/.failed, started under 8 hours ago
      - an agent.invocation.detached under 24 hours ago (its worker may still run)
      - any agent or conversation event on the ticket in the last 30 minutes
      - an agent-CLI event in the last 30 minutes whose working directory names the ticket key (a worker in its worktree)
    unknown: Candystore unreachable or erroring; krebs touches nothing and warns
  suspects:                  # only tickets unchanged for 30 minutes
    release: In Progress, holds a slot (no lifecycle:review, no hold label), not an epic
    excluded: any ticket with lifecycle:human (no probe, no write)
    stale_working: agent:working in Todo or Backlog, or in In Progress without holding a slot, or on an epic
  actions:                   # only when no turn is live
    release: one write moves it to Todo and removes agent:working; other labels stay (a triaged ticket is not re-triaged); one comment says why. The freed slot refills on the same tick, in Todo order
    stale_working: remove agent:working; nothing else
    loop_guard: a ticket released 2 times in 7 days gets +agent:failed (and -agent:working) instead, stays In Progress, and a comment asks for a look
  caps: 2 releases per scope and 12 per tick; 30 label removals per tick
  journal: orphan.release, orphan.unstick, orphan.fail

catch_up:                    # krebs sends every board turn (triage, review) itself
  triage: a Todo ticket with no lifecycle:triaged, no hold_label, no agent:working and no epic container label, unchanged for board_turns.triage_quiet_seconds (2 minutes, since the event path debounces the edit itself) and with no live turn (orphans.liveness), gets a triage turn (the Fleet node's groomTicket command; no Plane write); krebs is the only triage sender (the n8n Ticket Triage lane is retired, ADR 0001); the command id is derived from board + ticket + updated_at (a ticket version is sent at most once), and a ticket is capped per episode (catch_up_attempts); at most 1 per scope per tick and 6 per tick, triage before review across the tick, oldest first, and none at all while the scope already has a board turn queued or running (board_turns.per_scope, ADR 0002); a candidate with a live turn is skipped and the next oldest takes the scope's turn (at most 3 liveness checks per scope per tick; ADR 0001)
  review: an In Progress ticket with lifecycle:review, no hold_label, no agent:working and no epic container label, unchanged for 30 minutes and with no live turn (orphans.liveness), gets a review turn from its scope's PM (reason ticket-review, dispatcher krebs-tick; no Plane write; the chip sets agent:working while it runs); it shares the 1 board turn per scope per tick with triage (a scope alternates; after a triage turn its oldest review goes first, and the other way round, so neither backlog starves the other) and the 6 per tick; the command id is derived from board + ticket + updated_at + attempt; a review with no verdict is asked again after 3 hours, at most 3 times per episode (catch_up_attempts)
  dispatch: a dispatch whose publish failed is republished with the same command id on the next tick

catch_up_attempts:           # added 2026-11-20 (33GOD-33: 50 review turns in 42 hours, HEYMA-39: 12 triage turns in 8 hours)
  why: >
    A board turn that ends with no outcome (no verdict, no lifecycle:triaged, no hold label) is asked again a
    bounded number of times, then the ticket is parked. The count cannot be keyed on the ticket version: the
    pickup chip adds agent:working when a turn starts and removes it when it ends, so every turn, even one whose
    model call was refused, leaves a new updated_at behind, and a version-keyed count read "attempt 1" for ever.
  episode: >
    The count is per episode, read from the ticket's own activity log. An episode begins at the latest of:
    review: lifecycle:review added (the handback); triage: the ticket entered its current Todo state, was created
    in it, or lost lifecycle:triaged (an owner's re-triage); either: a hold label removed (agent:failed,
    needs-input, blocked, human), so whoever clears Krebs's park or answers the question restarts the count.
    The chip's agent:working pairs, comments and edits never begin one. Attempts are the board turns Krebs
    published for the ticket since then (journal review.publish / triage.publish, 7-day look-back).
  review: {max_attempts: 3, min_gap: 3 hours}
  triage: {max_attempts: 3, min_gap: 30 minutes}
  at_the_cap: >
    The ticket is parked: +agent:failed (the same hold the orphan loop guard uses; nothing else changes) and one
    comment saying who was asked what, how many times, and how to resume. A ticket is parked only after a live
    re-read passes the same guard the send would, and Candystore shows no live turn (unknown or live: left for
    the next tick). At most 12 parks per tick. Journal: loop.park.
  unreadable: if the activity log cannot be read, the ticket is neither sent a turn nor parked, and the tick warns
  first_turn: a ticket with no prior board turn on record never reads the activity log

board_turns:                 # ADR 0002: when a board turn (triage, review) may be sent, and how the event path times a run
  per_scope: 1               # a scope has at most ONE board turn queued or running, any ticket, either kind (a desk serializes board turns on its lease; two at once collide). The tick asks Candystore (gateway queued/started with no completed/failed, plus its own journalled sends) and sends none while one is in flight; Candystore unreachable means none. A board turn with no end on record after 3 hours is presumed dead.
  triage_quiet_seconds: 120  # a Todo ticket unchanged this long is a triage candidate (600 while the 10-minute tick was the only clock)
  review_quiet_seconds: 1800 # a handed-back ticket unchanged this long is a review candidate
  settle_seconds:            # krebs watch: wait this long after the last event of a burst, then run that board's tick
    plane_edit: 60           # (never later than 180 s after the burst's first edit)
    turn_ended: 8            # a gateway agent.invocation.completed or .failed: the next board turn starts when the previous one ends
  triggers: [schedule, plane-edit, turn-ended, quiet-window]   # recorded on the journal's tick line as `trigger`

clock: Candybar `krebs-tick` (exec runner, every 10 minutes) is the backstop and the only clock. The event path (`krebs watch`, an event-driven systemd service on a JetStream consumer, no timer, no loop of its own) runs the same tick for one board when a Plane ticket event or a gateway turn end arrives, and re-arms a board only for a time already read off it (a ticket's quiet window ending) or a bounded retry (tick.lock held; Candystore not yet caught up). Krebs's own Plane writes are recognised in the journal and do not start a run. No other dispatcher.
writes: Pilot plane.js (delta label edits) for Krebs; px / px-apply for PM passes.
out_of_scope:                # owner, 2026-11-14
  boards: [TIKT]             # human content pipeline; keeps its own lanes
  workspaces: [automaticai]  # client boards AAI and JIMB; Krebs never writes there
  archived: skipped
fence: a project whose .project.json execution.mode is not legacy is skipped (the managed execution engine was deleted 2026-11-18; no project sets it).
