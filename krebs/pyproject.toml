[project]
name = "krebs-execution"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "nats-py>=2.9,<3", "jsonschema>=4.23,<5", "asyncpg>=0.29,<1", "structlog>=24,<26"]
[project.scripts]
krebs = "krebs.service:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/krebs"]
[dependency-groups]
dev = ["pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
