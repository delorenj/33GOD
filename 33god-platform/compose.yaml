name: 33god-platform

# Component sources normally live beside 33god-platform in the populated
# monorepo. Set GOD_SOURCE_ROOT when rendering this file from an isolated
# worktree (for example, /home/delorenj/code/33GOD).
x-33god-source-root: ${GOD_SOURCE_ROOT:-..}
x-33god-model:
  default: local
  tools: local-one-shot
  full: local-with-tools
  cloud: unsupported-local-bind-model
x-lifecycle-image: &lifecycle-image ghcr.io/delorenj/lifecycle@sha256:20a6d4e7c37ceee9867e05e922d46f3fa682ccf597dff4bb733e3f5649850a76

services:
  bloodbank-nats:
    image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222", "-DV"]
    environment:
      BLOODBANK_NATS_URL: nats://nats:4222
    ports:
      - target: 4222
        published: "${BLOODBANK_NATS_CLIENT_PORT:-4222}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 8222
        published: "${BLOODBANK_NATS_MONITOR_PORT:-8222}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - bloodbank-nats-data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet --timeout=3 http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      bloodbank-network:
        aliases: [nats]
    restart: unless-stopped

  nats-init:
    image: natsio/nats-box@sha256:0784ab710aefaf6ef037ed797ee7dcde613c6ad208c4dbff1945fc7c1b5b5375
    depends_on:
      bloodbank-nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - type: bind
        source: ${GOD_SOURCE_ROOT:-..}/bloodbank/compose/nats/streams.json
        target: /work/streams.json
        read_only: true
      - type: bind
        source: ${GOD_SOURCE_ROOT:-..}/bloodbank/compose/nats/init.sh
        target: /work/init.sh
        read_only: true
    entrypoint: ["/bin/sh", "/work/init.sh"]
    networks: [bloodbank-network]
    restart: "no"

  lifecycle-postgres:
    image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment:
      POSTGRES_USER: lifecycle
      POSTGRES_DB: lifecycle
      POSTGRES_PASSWORD_FILE: /run/secrets/lifecycle-postgres-password
    secrets: [lifecycle-postgres-password]
    volumes:
      - lifecycle-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecycle -d lifecycle"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      lifecycle-internal:
        aliases: [lifecycle-postgres]
    restart: unless-stopped

  lifecycle-migrate:
    image: *lifecycle-image
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        password="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print(quote(Path("/run/secrets/lifecycle-postgres-password").read_text().strip(), safe=""))')"
        export LIFECYCLE_DATABASE_URL="postgresql://lifecycle:$${password}@lifecycle-postgres:5432/lifecycle"
        unset password
        exec python -m main migrate
    secrets: [lifecycle-postgres-password]
    depends_on:
      lifecycle-postgres:
        condition: service_healthy
    networks: [lifecycle-internal]
    restart: "no"

  lifecycle-bootstrap:
    image: *lifecycle-image
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        password="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print(quote(Path("/run/secrets/lifecycle-postgres-password").read_text().strip(), safe=""))')"
        export LIFECYCLE_DATABASE_URL="postgresql://lifecycle:$${password}@lifecycle-postgres:5432/lifecycle"
        unset password
        exec python -m main bootstrap \
          --lifecycle-id "$${LIFECYCLE_BOOTSTRAP_ID}" \
          --name "$${LIFECYCLE_BOOTSTRAP_NAME}" \
          --repo "$${LIFECYCLE_BOOTSTRAP_REPO}" \
          --actor-id "$${LIFECYCLE_BOOTSTRAP_ACTOR_ID}" \
          --capability-id "$${LIFECYCLE_BOOTSTRAP_CAPABILITY_ID}" \
          --as-of "$${LIFECYCLE_BOOTSTRAP_AS_OF}" \
          --mode "$${LIFECYCLE_BOOTSTRAP_MODE}"
    environment:
      LIFECYCLE_BOOTSTRAP_ID: "${LIFECYCLE_BOOTSTRAP_ID:-lc_33god_platform}"
      LIFECYCLE_BOOTSTRAP_NAME: "${LIFECYCLE_BOOTSTRAP_NAME:-33GOD Platform}"
      LIFECYCLE_BOOTSTRAP_REPO: "${LIFECYCLE_BOOTSTRAP_REPO:-delorenj/33GOD}"
      LIFECYCLE_BOOTSTRAP_ACTOR_ID: "${LIFECYCLE_BOOTSTRAP_ACTOR_ID:-operator:33god-bootstrap}"
      LIFECYCLE_BOOTSTRAP_CAPABILITY_ID: "${LIFECYCLE_BOOTSTRAP_CAPABILITY_ID:-cap:33god-platform:lifecycle-command}"
      LIFECYCLE_BOOTSTRAP_AS_OF: "${LIFECYCLE_BOOTSTRAP_AS_OF:-2026-07-18T00:00:00Z}"
      LIFECYCLE_BOOTSTRAP_MODE: "${LIFECYCLE_BOOTSTRAP_MODE:-supervised}"
    secrets: [lifecycle-postgres-password]
    depends_on:
      lifecycle-migrate:
        condition: service_completed_successfully
    networks: [lifecycle-internal]
    restart: "no"

  lifecycle:
    image: *lifecycle-image
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        password="$$(python -c 'from pathlib import Path; from urllib.parse import quote; print(quote(Path("/run/secrets/lifecycle-postgres-password").read_text().strip(), safe=""))')"
        export LIFECYCLE_DATABASE_URL="postgresql://lifecycle:$${password}@lifecycle-postgres:5432/lifecycle"
        unset password
        exec python -m main serve
    environment:
      BLOODBANK_NATS_URLS: nats://nats:4222
      LIFECYCLE_INSTANCE: "${LIFECYCLE_INSTANCE:-33god-platform}"
      LIFECYCLE_HTTP_HOST: 0.0.0.0
      LIFECYCLE_HTTP_PORT: "8080"
    secrets: [lifecycle-postgres-password]
    ports:
      - target: 8080
        published: "${LIFECYCLE_PORT:-8088}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      lifecycle-postgres:
        condition: service_healthy
      lifecycle-bootstrap:
        condition: service_completed_successfully
      bloodbank-nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "main", "healthcheck", "--url", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [lifecycle-internal, bloodbank-network]
    restart: unless-stopped

  dapr-placement:
    image: daprio/dapr@sha256:0d9dbe22d81dad91f3cde6f85a31ad0185ceaa55f82a4ba29cc46020f31a79d4
    command: ["./placement", "--port", "50005"]
    ports:
      - target: 50005
        published: "${BLOODBANK_DAPR_PLACEMENT_PORT:-50005}"
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      bloodbank-network:
        aliases: [dapr-placement]
    restart: unless-stopped

  candystore-postgres:
    image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment:
      POSTGRES_USER: candystore
      POSTGRES_PASSWORD: candystore
      POSTGRES_DB: candystore
    volumes:
      - candystore-pgdata:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: "${CANDYSTORE_POSTGRES_PORT:-5434}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candystore -d candystore"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      candystore-internal:
        aliases: [postgres]
    restart: unless-stopped

  candystore:
    build:
      context: ${GOD_SOURCE_ROOT:-..}/candystore
    image: ${CANDYSTORE_IMAGE:-candystore:local}
    environment:
      APP_PORT: "3001"
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://candystore:candystore@postgres:5432/candystore
      SUBSCRIBE_PUBSUB: bloodbank-pubsub
      SUBSCRIBE_TOPIC: bloodbank.evt.v1.>
      SUBSCRIBE_ROUTE: /events/all
    ports:
      - target: 3001
        published: "${CANDYSTORE_PORT:-8683}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      candystore-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/readyz', timeout=3)"
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      candystore-internal:
        aliases: [candystore-app]
      proxy:
        aliases: [candystore]
    restart: unless-stopped

  candystore-daprd:
    image: daprio/daprd@sha256:286806d0eac7edc37c310427e7813da403257f51395eeec912cdd2889f9a9b37
    command:
      - ./daprd
      - --app-id=candystore
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --app-port=3001
      - --app-channel-address=candystore-app
      - --app-protocol=http
      - --resources-path=/components
      - --placement-host-address=dapr-placement:50005
      - --log-level=info
    volumes:
      - type: bind
        source: ${GOD_SOURCE_ROOT:-..}/candystore/dapr-components
        target: /components
        read_only: true
    ports:
      - target: 3500
        published: "${CANDYSTORE_DAPR_HTTP_PORT:-3504}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      nats-init:
        condition: service_completed_successfully
      dapr-placement:
        condition: service_started
      candystore:
        condition: service_healthy
    networks: [candystore-internal, bloodbank-network]
    restart: unless-stopped

  holocene-api-preflight:
    image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
    command: ["--fail", "--silent", "--show-error", "http://host.docker.internal:4000/health"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      candystore:
        condition: service_healthy
    networks: [candystore-internal]
    restart: "no"

  holocene-web:
    image: node@sha256:1031993481795705055273f2eef0c24597abdcb277d6e058c82f78cbbdef92a6
    working_dir: /app
    command: >
      sh -c "corepack enable
      && pnpm install --frozen-lockfile --prod=false
      && mkdir -p apps/web/.next
      && find apps/web/.next -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      && NODE_ENV=production pnpm --filter @holocene/org-model build
      && NODE_ENV=production pnpm --filter @holocene/web build
      && NODE_ENV=production pnpm --filter @holocene/web start"
    env_file:
      - path: ${GOD_SOURCE_ROOT:-..}/holocene/.env.holocene-web
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HOLOCENE_API_INTERNAL_URL: http://host.docker.internal:4000
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - type: bind
        source: ${GOD_SOURCE_ROOT:-..}/holocene
        target: /app
      - holocene-node-modules:/app/node_modules
      - holocene-web-node-modules:/app/apps/web/node_modules
      - holocene-web-next:/app/apps/web/.next
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      holocene-api-preflight:
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.http.routers.holocene-web.entrypoints: websecure
      traefik.http.routers.holocene-web.rule: Host(`holocene.delo.sh`)
      traefik.http.routers.holocene-web.priority: "300"
      traefik.http.routers.holocene-web.middlewares: google-auth@file
      traefik.http.services.holocene-web.loadbalancer.server.port: "3001"
      traefik.http.routers.holocene-web.service: holocene-web
      traefik.http.routers.holocene-web.tls: "true"
      traefik.http.routers.holocene-web.tls.certresolver: letsencrypt
      traefik.http.routers.holocene-hq.rule: Host(`holocene.delo.sh`) && (PathPrefix(`/hq`) || PathPrefix(`/_next/static`))
      traefik.http.routers.holocene-hq.priority: "350"
      traefik.http.routers.holocene-hq.entrypoints: websecure
      traefik.http.routers.holocene-hq.service: holocene-web
      traefik.http.routers.holocene-hq.tls: "true"
      traefik.http.routers.holocene-hq.tls.certresolver: letsencrypt
      traefik.docker.network: proxy
    networks:
      proxy:
        aliases: [holocene-web]
    restart: unless-stopped

  pjangler-cli:
    image: node@sha256:1031993481795705055273f2eef0c24597abdcb277d6e058c82f78cbbdef92a6
    profiles: [tools, full]
    working_dir: /workspace
    entrypoint: ["/opt/33god/pjangler-tool-entrypoint.sh"]
    command: ["--help"]
    environment:
      PJANGLER_TOOL_MODE: cli
    volumes:
      - type: bind
        source: ${GOD_SOURCE_ROOT:-..}/pjangler
        target: /workspace
        read_only: true
      - /workspace/node_modules
      - ./scripts/pjangler-tool-entrypoint.sh:/opt/33god/pjangler-tool-entrypoint.sh:ro
    deploy:
      replicas: 0
    restart: "no"

  pjangler-mcp:
    image: node@sha256:1031993481795705055273f2eef0c24597abdcb277d6e058c82f78cbbdef92a6
    profiles: [tools, full]
    working_dir: /workspace
    entrypoint: ["/opt/33god/pjangler-tool-entrypoint.sh"]
    environment:
      PJANGLER_TOOL_MODE: mcp
    volumes:
      - type: bind
        source: ${GOD_SOURCE_ROOT:-..}/pjangler
        target: /workspace
        read_only: true
      - /workspace/node_modules
      - ./scripts/pjangler-tool-entrypoint.sh:/opt/33god/pjangler-tool-entrypoint.sh:ro
    stdin_open: true
    tty: false
    deploy:
      replicas: 0
    restart: "no"

  cloud-unsupported:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    profiles: [cloud]
    command:
      - sh
      - -eu
      - -c
      - echo '33god-platform is not cloud-production-ready; this model requires local bind mounts, host services, and external local networks.' >&2; exit 64
    network_mode: none
    restart: "no"

networks:
  bloodbank-network:
    external: true
    name: ${BLOODBANK_NETWORK_NAME:-bloodbank-network}
  lifecycle-internal:
    external: true
    name: ${LIFECYCLE_NETWORK_NAME:-lifecycle-internal}
  candystore-internal:
    external: true
    name: ${CANDYSTORE_NETWORK_NAME:-candystore-internal}
  proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:-proxy}

volumes:
  bloodbank-nats-data:
    external: true
    name: ${BLOODBANK_NATS_VOLUME:-bloodbank_bloodbank-nats-data}
  lifecycle-pgdata:
    external: true
    name: ${LIFECYCLE_POSTGRES_VOLUME:-lifecycle_pgdata}
  candystore-pgdata:
    external: true
    name: ${CANDYSTORE_POSTGRES_VOLUME:-candystore_pgdata}
  holocene-node-modules:
    external: true
    name: ${HOLOCENE_NODE_MODULES_VOLUME:-holocene_holocene_node_modules}
  holocene-web-node-modules:
    external: true
    name: ${HOLOCENE_WEB_NODE_MODULES_VOLUME:-holocene_holocene_web_node_modules}
  holocene-web-next:
    external: true
    name: ${HOLOCENE_WEB_NEXT_VOLUME:-holocene_holocene_web_next}

secrets:
  lifecycle-postgres-password:
    file: ${LIFECYCLE_POSTGRES_PASSWORD_FILE:-/run/secrets/33god-lifecycle-postgres-password}
