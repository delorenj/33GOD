id: pjangler
name: PJangler
role: provisioning-control-plane
repo: ../pjangler
description: Project subsystem bootstrapper CLI and MCP server for 33GOD projects, including the project registry and the portable repository-ignore contract. Employees are Flume's.
compose:
  files: []
  platform_projection: ../compose.yaml
  services: [pjangler-cli, pjangler-mcp]
  profiles: [tools, full]
  state: validated-target-not-live-cutover
  ownership: Root owns the narrow tool projection; PJangler owns CLI and stdio MCP behavior.
  execution: run-only-zero-replicas
  listeners: none
health:
  commands:
    - cd ../pjangler && npm test
source_of_truth:
  - ../pjangler/src
  - ../pjangler/templates/commonproject
  - ~/.config/pjangler
changelog:
  topics: [project-registry, provisioning, templates, mcp]
public_card:
  title: Project Factory
  promise: Reproducible project provisioning from one registry.
contracts:
  repository_ignore: CommonProject preserves repo rules and never copies core.excludesFile; .agents is canonical and client roots remain local generated projections.
  index_reconciliation: PJangler never bulk-untracks files; use gitignore-maintenance after effective-rule review.
backfills:
  - gitignore-global-policy-v1
