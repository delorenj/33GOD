id: krebs
name: Krebs
role: ticket-lifecycle-engine
repo: ../krebs
description: The Krebs lifecycle v2 dispatcher (krebs tick); dispatches triaged Todo tickets into per-scope slots, sends triage and PM review turns, releases orphans whose turn is over.
compose:
  files: []
  profiles: [integrations]
health:
  commands:
    - krebs tick --dry-run
source_of_truth:
  - ../krebs/spec/lifecycle.v2.yaml
  - ../krebs/docs/lifecycle.md
  - ../krebs/tick
  - ../krebs/adapters/tp
changelog:
  topics: [lifecycle, tickets, plane, slots, triage, review]
public_card:
  title: Ticket Lifecycle Engine
  promise: One ticket lifecycle on every board, five lanes and a few labels, with exactly one dispatcher.
backfills: []

# --- Atlas (I-12): map fields, rendered by scripts/atlas.py ---
kind: service
first_party: true
domain: G8
c4:
  level: container
  parent: ''
status: live
summary: Decides which ticket goes to which agent and sends the work order.
role_in_system: Without it tickets sit untouched.
tech:
- node
runtime: Candybar job krebs-tick every 10 minutes
relations:
- to: bb-nats
  kind: publishes-to
  via: bloodbank.cmd.agent.invocation.start
  evidence: krebs/tick/run.mjs
- to: plane
  kind: reads
  via: Plane REST
  evidence: krebs/tick/deps.mjs
- to: agents-registry
  kind: reads
  via: loadHermesRegistry(~/.hermes/agents-registry.yaml)
  evidence: krebs/bin/krebs.mjs:103
  anchor: const registry = await bb.registry.loadHermesRegistry(registryPath);
- to: pilot
  kind: calls
  via: import pilot/src/plane.js Plane + config.js homeBinding
  evidence: krebs/tick/deps.mjs:75
  anchor: const { Plane } = await import(pathToFileURL(join(dir, "src", "plane.js")).href);
- to: n8n-nodes-bb
  kind: calls
  via: require dist/nats.js publish, buildEnvelope; dist/registry.js
  evidence: krebs/tick/deps.mjs:40
  anchor: nats = require(join(dist, "nats.js"));
- to: candystore
  kind: reads
  via: GET /events by ticket correlation id (turn liveness)
  evidence: krebs/tick/liveness.mjs
evidence:
- krebs/tick/run.mjs
- krebs/.candybars/krebs-tick.candybar.toml
- krebs/tick/liveness.mjs
confidence: high
notes: Enabled live. The Python managed-execution engine (krebs-execution.service, Postgres schema krebs) was deleted 2026-11-18.
factory:
  near: crew
