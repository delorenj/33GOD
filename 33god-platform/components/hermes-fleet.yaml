id: hermes-fleet
name: Hermes Fleet
role: agent-runtime-fleet
repo: ../hermes-agent-template
description: Shared Hermes runtime, profiles, systemd units, and the job-description template agent role scaffolds are rendered from. Flume is the tool that renders and reviews them.
compose:
  files: []
  profiles: [agents]
health:
  commands:
    - test -f ~/.hermes/fleet.env
    - test -f ~/.hermes/agents-registry.yaml
source_of_truth:
  - ~/.hermes/fleet.env
  - ~/.hermes/config.yaml
  - ~/.hermes/agents-registry.yaml
  - ../hermes-agent-template
changelog:
  topics: [agent-runtime, fleet-config, profiles, systemd]
public_card:
  title: Managed AI Worker Fleet
  promise: Long-running agents with shared provider config and profile-local state.
backfills:
  - hermes-inherited-profile-config-v1

# --- Atlas (I-12): map fields, rendered by scripts/atlas.py ---
kind: agent
first_party: true
domain: G3
c4:
  level: container
  parent: ''
status: live
summary: The set of AI agents (project managers, directors, specialists) that do the platform's work.
role_in_system: Without it tickets are dispatched to nobody.
tech:
- python
- hermes-agent
runtime: one install ~/.hermes/hermes-agent, 49 profile dirs
relations:
- to: agents-registry
  kind: reads
  via: ~/.hermes/agents-registry.yaml
  evidence: /home/delorenj/.hermes/agents-registry.yaml
- to: agents-registry
  kind: writes
  via: 80-registry.sh appends agent row to registry file
  evidence: hermes-agent-template/template/.scripts/80-registry.sh:47
  anchor: 'log "[80] appending to fleet registry: $REGISTRY_FILE"'
- to: plane
  kind: calls
  via: Plane REST $PLANE_BASE/api/v1/workspaces (ticket provider)
  evidence: hermes-agent-template/template/.scripts/providers/plane.sh:249
  anchor: API="$BASE/api/v1/workspaces/$WS"
evidence:
- /home/delorenj/.hermes/agents-registry.yaml (46 rows, 28 pm)
confidence: high
surfaces:
- producer:hermes-agent
- producer:hermes-agent:*
- repo:hermes-agent-template
factory:
  near: crew
