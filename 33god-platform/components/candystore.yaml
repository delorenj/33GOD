id: candystore
name: Candystore
role: event-audit-trail
repo: ../candystore
description: Durable Bloodbank event history, query API, summaries, and UI.
compose:
  files:
    - ../candystore/compose.yml
  platform_projection: ../compose.yaml
  services: [candystore-postgres, candystore, candystore-daprd]
  profiles: [default]
  state: validated-target-not-live-cutover
  ownership: Root owns the normalized projection; Candystore owns its image, migrations, API, and durable Dapr component.
  cardinality: exactly-one-postgres-app-daprd
health:
  commands:
    - cd ../candystore && mise run test
source_of_truth:
  - ../candystore/migrations
  - ../candystore/candystore
  - ../candystore/web
changelog:
  topics: [event-storage, audit, postgres, dapr]
public_card:
  title: Event History
  promise: Queryable event/session memory for the whole pipeline.
backfills: []
