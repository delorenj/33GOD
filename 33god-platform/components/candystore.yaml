id: candystore
name: Candystore
role: audit-and-read-projection
repo: ../candystore
description: Append-only Bloodbank audit history plus rebuildable Lifecycle read projections and query API; never a lifecycle writer.
source_revision: 3c00080446bb9d4cb55c670477983306abcfe7ce
compose:
  files:
    - ../candystore/compose.yml
  platform_projection: ../compose.yaml
  services: [candystore-postgres, candystore, candystore-daprd]
  profiles: [default]
  state: validated-local-and-isolated-live
  ownership: Root owns the normalized projection; Candystore owns its image, migrations, API, and durable Dapr component.
  cardinality: exactly-one-postgres-app-daprd
health:
  commands:
    - cd ../candystore && mise run test
source_of_truth:
  - ../candystore/migrations
  - ../candystore/candystore
  - ../candystore/web
changelog:
  topics: [event-storage, audit, postgres, dapr, lifecycle-projection]
public_card:
  title: Event History
  promise: Queryable event/session memory for the whole pipeline.
backfills: []
