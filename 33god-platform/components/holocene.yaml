id: holocene
name: Holocene
role: control-plane-dashboard
repo: ../holocene
description: Live dashboard for fleet, tooling, hook health, and pipeline status.
compose:
  files:
    - ../holocene/compose.yml
  platform_projection: ../compose.yaml
  services: [holocene-api-preflight, holocene-web]
  profiles: [default]
  state: validated-target-not-live-cutover
  ownership: Root owns the normalized web projection and preflight; Holocene owns web behavior and the host API unit.
  external_prerequisite: holocene-api.service on host port 4000
health:
  commands:
    - cd ../holocene && pnpm test
source_of_truth:
  - ../holocene/apps
  - ../holocene/packages
  - ../holocene/docs
changelog:
  topics: [dashboard, status, live-data, tooling-health]
public_card:
  title: Mission Control
  promise: Live operational view of agents, events, and platform health.
backfills: []
