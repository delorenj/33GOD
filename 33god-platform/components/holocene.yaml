id: holocene
name: Holocene
role: control-plane-dashboard
repo: ../holocene
description: Mission-control dashboard plus real-browser Lifecycle read/action surface backed by Candystore projections and Bloodbank commands.
source_revision: 80d9cc8be81eebe4476304a4b186da445731a5ab
compose:
  files:
    - ../holocene/compose.yml
  platform_projection: ../compose.yaml
  services: [holocene-api-preflight, holocene-web]
  profiles: [default]
  state: validated-local-and-isolated-live
  ownership: Root owns the normalized web projection and preflight; Holocene owns web behavior and the host API unit.
  external_prerequisite: holocene-api.service on host port 4000
health:
  commands:
    - cd ../holocene && pnpm test
source_of_truth:
  - ../holocene/apps
  - ../holocene/packages
  - ../holocene/docs
changelog:
  topics: [dashboard, status, live-data, tooling-health, lifecycle-client, lifecycle-browser-proof]
public_card:
  title: Mission Control
  promise: Live operational view of agents, events, and platform health.
backfills: []
