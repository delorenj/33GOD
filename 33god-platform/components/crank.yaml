notes: |-
  Built on statekit (consumer 2 of bloodbank/services/agent-hooks/core/statekit.py; the ASM is consumer 1).
  The arbiter is ~/.agents/tools/jev-clairic/bin/crank.lua, a Redis Functions library "crank" loaded through
  statekit.Library by bin/crank_arbiter.py (`zcrankctl arbiter-load`). It is the single writer of the crank keys:
  zcrank.py, zcrankctl and pjangler send signals (crank_apply, crank_scan) and ask crank_resolve; none writes a key
  or carries the rule. Registry keys are unchanged (zcrank:tab:<key>, zcrank:pane:<owner>:<pane>, zcrank:log:<key>,
  zcrank:config). New keys: crank:p:<session>:<pane> (resolved on/since/decided_by/interval/keys/owners/last_run/
  next_due/scan_ms/held/seq, 1d TTL), crank:idx:panes, crank:t:<session>:<pane> and crank:t (transition streams),
  crank:engine (heartbeat), pubsub channel crank:transitions (one JSON per edge). Operator views: zcrankctl pane,
  history, tail. The gate (zcrank-gate.py via zcrank.py classify) reads the ASM state of each pane first
  (working/tool_running/delegating -> working; awaiting_human/failed/idle -> waiting; anything else falls back to the
  screen) and reports state_source and asm_state per pane, skipping the 2.5s re-dump when ASM answers. The
  on_since.json writer is retired (its reader only seeds new panes; remove after 2026-12-01).
