id: bloodbank
name: Bloodbank
role: event-backbone
repo: ../bloodbank
description: NATS JetStream and Dapr event backbone for all 33GOD inter-service traffic.
source_revision: 48031ee39c238b9d4715b81b74076635235f96d5
compose:
  files:
    - ../bloodbank/compose/docker-compose.yml
  platform_projection: ../compose.yaml
  services: [bloodbank-nats, nats-init, dapr-placement]
  profiles: [default]
  state: validated-local-and-isolated-live
  ownership: Root owns the normalized projection; Bloodbank owns NATS, stream, and Dapr contracts.
  excluded: [legacy-candystore-postgres, legacy-candystore-app, legacy-candystore-daprd]
health:
  commands:
    - cd ../bloodbank && mise run validate:schemas
    - cd ../bloodbank && mise run hooks:check
source_of_truth:
  - ../bloodbank/docs/event-naming.md
  - ../bloodbank/schemas
  - ../bloodbank/services/agent-hooks/hooks.master.json
changelog:
  topics: [events, schemas, hooks, dapr, nats, lifecycle-contracts]
public_card:
  title: Event Backbone
  promise: CloudEvents over NATS/Dapr with canonical schemas and provider-neutral agent hooks.
backfills:
  - bloodbank-canonical-agent-publisher-v1
