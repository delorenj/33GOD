id: bloodbank
name: Bloodbank
role: event-backbone
repo: ../bloodbank
description: NATS JetStream and Dapr event backbone for all 33GOD inter-service traffic.
compose:
  files:
    - ../bloodbank/compose/docker-compose.yml
  platform_projection: ../compose.yaml
  services: [bloodbank-nats, nats-init, dapr-placement]
  profiles: [default]
  state: validated-target-not-live-cutover
  ownership: Root owns the normalized projection; Bloodbank owns NATS, stream, and Dapr contracts.
  excluded: [legacy-candystore-postgres, legacy-candystore-app, legacy-candystore-daprd]
health:
  commands:
    - cd ../bloodbank && mise run validate:schemas
    - cd ../bloodbank && mise run hooks:check
source_of_truth:
  - ../bloodbank/docs/event-naming.md
  - ../bloodbank/schemas
  - ../bloodbank/services/agent-hooks/hooks.master.json
changelog:
  topics: [events, schemas, hooks, dapr, nats]
public_card:
  title: Event Backbone
  promise: CloudEvents over NATS/Dapr with canonical schemas and provider-neutral agent hooks.
backfills:
  - bloodbank-canonical-agent-publisher-v1

# --- Atlas (I-12): map fields, rendered by scripts/atlas.py ---
kind: bus
first_party: true
domain: G1
c4:
  level: container
  parent: ''
status: live
summary: 'The event backbone: every service publishes and listens for CloudEvents on it.'
role_in_system: Without it no service can tell another that anything happened; dispatch, audit and alerts all stop.
tech:
- nats-jetstream
- cloudevents
- dapr
- python
runtime: No live container belongs to compose project 'bloodbank'. bloodbank/compose/docker-compose.yml is a self-hosted
  sandbox (bloodbank-postgres, daprd-subscribe, heartbeat-*, apicurio, eventcatalog) that is not running. The live
  bus (NATS, dapr placement, candystore, enricher) comes from 33god-platform/compose.yaml; bloodbank-owned live
  pieces are host systemd units (hook-hub, artifact-sidecar, artifact-vault-projector, target-watch) and separate
  per-service compose projects (ntfy-router, turn-enricher, cost-bridge, farm-command-bridge)
relations:
- to: bb-nats
  kind: hosts
  via: compose service nats (nats:2.10 -js)
  evidence: bloodbank/compose/docker-compose.yml:25
- to: bb-nats
  kind: deploys
  via: nats-init applies compose/nats/streams.json (BLOODBANK_EVENTS/COMMANDS)
  evidence: bloodbank/compose/docker-compose.yml:55
  anchor: 'nats-init:'
- to: bb-dapr
  kind: hosts
  via: compose daprd sidecars on pubsub.jetstream bloodbank-pubsub
  evidence: bloodbank/compose/docker-compose.yml:331
  anchor: 'daprd-candystore:'
- to: bb-apicurio
  kind: hosts
  via: compose service apicurio-registry :8080
  evidence: bloodbank/compose/docker-compose.yml:410
  anchor: 'apicurio-registry:'
- to: bb-catalog
  kind: hosts
  via: compose service eventcatalog :3000
  evidence: bloodbank/compose/docker-compose.yml:435
  anchor: 'eventcatalog:'
- to: candystore
  kind: hosts
  via: compose profile candystore, SUBSCRIBE_TOPIC bloodbank.evt.>
  evidence: bloodbank/compose/docker-compose.yml:300
  anchor: 'candystore:'
evidence:
- bloodbank/compose/docker-compose.yml
- bloodbank/CLAUDE.md:1-25
confidence: high
notes: Producers publish raw NATS; Dapr is subscribe-side only. No RabbitMQ, no FastAPI publisher.
surfaces:
- container:bloodbank-dapr-placement
- container:bloodbank-nats
- repo:bloodbank
factory:
  station: belt
