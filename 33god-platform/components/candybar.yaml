id: candybar
name: Candybar
role: bloodbank-cron-framework
repo: ../candybar
description: Bloodbank-driven cron registry, minute dispatcher, host executor and reversible native-scheduler migration.
compose:
  files: []
  profiles: [optional]
health:
  commands:
    - curl -fsS https://candybar.delo.sh/healthz
    - systemctl --user is-active candybar-executor.service
source_of_truth:
  - ../candybar/src/candybar
  - ../candybar/deploy
  - ../candybar/_bmad-output/planning-artifacts/cron-inventory.md
changelog:
  topics: [cron, scheduling, bloodbank, migrations]
public_card:
  title: Cron Framework
  promise: Schedule and meter jobs through Bloodbank with a reversible migration ledger.
backfills: []

# --- Atlas (I-12): map fields, rendered by scripts/atlas.py ---
kind: scheduler
first_party: true
domain: G9
c4:
  level: container
  parent: ''
status: live
summary: The single clock that starts every recurring job on time.
role_in_system: Without it no recurring work runs, including Krebs dispatch and the daily report.
tech:
- python
- postgres
runtime: control-plane container (heartbeat, dispatcher, api 127.0.0.1:8700)
relations:
- to: krebs
  kind: schedules
  via: krebs-tick.candybar.toml */10
  evidence: krebs/.candybars/krebs-tick.candybar.toml
- to: n8n
  kind: schedules
  via: n8n runner webhook
  evidence: candybar/README.md
- to: hermes-gw
  kind: schedules
  via: hermes runner
  evidence: candybar/README.md
- to: bb-nats
  kind: publishes-to
  via: bloodbank.evt.cron.tick.fired (heartbeat, JetStream)
  evidence: candybar/src/candybar/heartbeat/publisher.py:53
- to: bb-nats
  kind: consumes-from
  via: durable candybar-dispatcher-ticks on bloodbank.evt.cron.tick.>
  evidence: candybar/src/candybar/dispatcher/role.py:77
- to: bb-nats
  kind: publishes-to
  via: bloodbank.cmd.cron.candybar.invoke (dispatcher)
  evidence: candybar/src/candybar/dispatcher/worker.py:312
- to: postgres
  kind: stores-in
  via: DATABASE_URL, candybar registry DB (sqlalchemy/psycopg)
  evidence: candybar/src/candybar/registry/store.py:54
- to: candybar-executor
  kind: schedules
  via: cmd bloodbank.cmd.cron.candybar.invoke on BLOODBANK_COMMANDS
  evidence: candybar/src/candybar/executor/role.py:76
- to: candybar-steward
  kind: calls
  via: API publishes bloodbank.cmd.cron.candybar.steward
  evidence: candybar/src/candybar/api/app.py:1229
- to: n8n-devjournal
  kind: schedules
  via: n8n runner webhook candybar/dev-journal-processor
  evidence: bloodbank/integrations/n8n-workflows/dev-journal/candybar/processor/candybar.toml:10
- to: plane-hook
  kind: schedules
  via: n8n runner webhook candybar/plane-ingress-reconcile
  evidence: bloodbank/.candybars/plane-ingress-reconcile.candybar.toml:11
evidence:
- curl 127.0.0.1:8700/candybars (139 jobs)
