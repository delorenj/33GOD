# Atlas record (I-12), imported 2026-11-14 from the four-lens sweep + critic. Edit freely; then `mise run platform:atlas`.
id: infra-doctor
name: infra-doctor
role: service
repo: ../../../.local/bin/infra-doctor
description: Runs synthetic probes against the homelab and platform and flags what is broken.
changelog:
  topics:
  - g4
  - service
kind: service
first_party: true
domain: G4
c4:
  level: container
  parent: ''
status: live
summary: Runs synthetic probes against the homelab and platform and flags what is broken.
role_in_system: Early warning for infrastructure drift; has a dead-man timer that alerts if the doctor itself stops.
tech:
- systemd
- shell
runtime: native infra-doctor.timer (about every minute) and infra-doctor-deadman.timer (5 min)
relations:
- to: n8n
  kind: calls
  via: HTTPS probe n8n.delo.sh/healthz
  evidence: ~/.config/infra-doctor/probes.yaml:17
  anchor: 'url: https://n8n.delo.sh/healthz'
- to: hindsight
  kind: calls
  via: HTTPS probe api.hs.delo.sh/health
  evidence: ~/.config/infra-doctor/probes.yaml:27
  anchor: 'url: https://api.hs.delo.sh/health'
- to: aai-gateway
  kind: calls
  via: HTTPS probe api.automaticai.io/api/status
  evidence: ~/.config/infra-doctor/probes.yaml:35
  anchor: 'url: https://api.automaticai.io/api/status'
- to: vox
  kind: calls
  via: HTTPS probe vox.delo.sh
  evidence: ~/.config/infra-doctor/probes.yaml:42
  anchor: 'url: https://vox.delo.sh'
- to: ntfy
  kind: calls
  via: HTTPS probe ntfy.delo.sh/v1/health
  evidence: ~/.config/infra-doctor/probes.yaml:49
  anchor: 'url: https://ntfy.delo.sh/v1/health'
- to: traefik
  kind: calls
  via: HTTPS probe traefik.delo.sh
  evidence: ~/.config/infra-doctor/probes.yaml:55
  anchor: 'url: https://traefik.delo.sh'
- to: hermes-gw
  kind: calls
  via: hermes-gateway-check liveness|channels|restart
  evidence: ~/.config/infra-doctor/probes.yaml:191
  anchor: 'type: hermes_gateway'
- to: ntfy
  kind: calls
  via: ntfy-alert on probe state change
  evidence: ~/.local/bin/infra-doctor:693
  anchor: '"$alert" --priority "$prio" --tags rotating_light \'
- to: candybar-watchdog
  kind: reads
  via: file_age ~/.local/state/candybar-watchdog/ok
  evidence: ~/.config/infra-doctor/probes.yaml:240
  anchor: 'path: /home/delorenj/.local/state/candybar-watchdog/ok'
- to: hermes-gateway-watchdog
  kind: reads
  via: file_age ~/.local/state/hermes-gateway-watchdog/last-run
  evidence: ~/.config/infra-doctor/probes.yaml:230
  anchor: 'path: /home/delorenj/.local/state/hermes-gateway-watchdog/last-run'
evidence:
- systemctl --user list-timers
- systemctl --user show infra-doctor Description
confidence: medium
notes: Native timers outside Candybar.
factory:
