const HUBS = /*HUBS_DATA*/null;
(function () {
  if (!ATLAS) { document.querySelector('.wrap').insertAdjacentHTML('beforeend', '<p class="empty">No atlas data. Run: mise run platform:atlas</p>'); return; }
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const byId = Object.fromEntries(ATLAS.components.map(c => [c.id, c]));
  const domIdx = Object.fromEntries(ATLAS.domains.map((d, i) => [d.id, i]));
  // Domain n takes --d<n> by position (13 hues, adjacent pairs pass the dataviz validator in both
  // themes); `hue: <1-13>` in components.yaml pins another; past 13 a domain falls back to --d0.
  const domColor = id => { const i = domIdx[id]; if (i == null) return 'var(--d0)'; const h = ATLAS.domains[i].hue;
    return h ? `var(--d${h})` : i >= 13 ? 'var(--d0)' : `var(--d${i + 1})`; };
  const out = {}, inc = {};
  ATLAS.edges.forEach(e => { (out[e.from] ||= []).push(e); (inc[e.to] ||= []).push(e); });
  const children = {};
  ATLAS.components.forEach(c => { if (c.level === 'component' && c.parent) (children[c.parent] ||= []).push(c); });
  const STATUSES = ['live', 'partial', 'built-not-running', 'planned', 'retired'];

  const matches = c => shown.has(c.status) && textMatch(c);

  function renderLanes() {

  function paintSpot() {

  function renderDetail() {

  function renderContext() {

  // ---- Graph: every component a node, every relation a directed edge -------------------------------
  // Plain JS and inline SVG, no libraries. The layout is a seeded force simulation (no unseeded randomness):
  // the same registry in the same box shape always draws the same picture, and positions stay put
  // while filters change, so the map you have learned survives a toggle.
  // One style per relation kind: a colour family (--e-*) and a dash. tests/test_atlas_graph.py holds
  // this table to atlas.py's RELATION_KINDS and to the default-on set.
  const EDGE_KINDS = {
    'calls':          { fam: 'call', dash: '',          on: true },
    'publishes-to':   { fam: 'bus',  dash: '',          on: true },
    'consumes-from':  { fam: 'bus',  dash: '5 3',       on: true },
    'reads':          { fam: 'data', dash: '5 3',       on: true },
    'writes':         { fam: 'data', dash: '',          on: true },
    'stores-in':      { fam: 'data', dash: '1.5 2.5',   on: true },
    'routes-llm-via': { fam: 'llm',  dash: '',          on: true },
    'renders':        { fam: 'data', dash: '8 3 1.5 3', on: false },
    'hosts':          { fam: 'ops',  dash: '',          on: false },

    'deploys':        { fam: 'ops',  dash: '1.5 2.5',   on: false },

  const graph = (function () {
    const NS = 'http://www.w3.org/2000/svg';

    const mk = (tag, attrs, parent) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (parent) parent.appendChild(el); return el; };
    const kinds = [...Object.keys(EDGE_KINDS), ...[...new Set(ATLAS.edges.map(e => e.kind))].filter(k => !EDGE_KINDS[k]).sort()];
    const kstyle = k => EDGE_KINDS[k] || { fam: 'call', dash: '2 3', on: false };
    const kindOn = Object.fromEntries(kinds.map(k => [k, kstyle(k).on]));
    const kindRank = Object.fromEntries(kinds.map((k, i) => [k, i]));
    const domOn = Object.fromEntries(ATLAS.domains.map(d => [d.id, true]));
    const domName = Object.fromEntries(ATLAS.domains.map(d => [d.id, d.name]));
    const tally = (list, key) => list.reduce((m, x) => (m[x[key]] = (m[x[key]] || 0) + 1, m), {});
    const kindN = tally(ATLAS.edges, 'kind'), domN = tally(ATLAS.components, 'domain');
    const degAll = {}; ATLAS.edges.forEach(e => { degAll[e.from] = (degAll[e.from] || 0) + 1; degAll[e.to] = (degAll[e.to] || 0) + 1; });
    const hubList = HUBS ? HUBS.hubs.filter(h => h.components.some(c => byId[c])) : [];
    const radius = d => 4.5 + Math.sqrt(d || 0) * 1.6;
    const layers = {};
    let ready = false, raf = 0, moved = false, hubsOn = false, hover = null;
    let world = null, worldKey = '', cam = { k: 1, x: 0, y: 0 }, kFit = 1;
    let vnodes = [], vedges = [], vhubs = [], vhubEdges = [], vdoms = [], at = {};

    // Legend: a checkbox per relation kind (its line and count) and per domain; hover a domain to see it.
    const swatch = k => { const s = kstyle(k); return `<svg class="sw f-${s.fam}" width="28" height="10" aria-hidden="true"><line x1="1" y1="5" x2="21" y2="5" class="ge"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/><path d="M20,1.5 L27,5 L20,8.5 z" class="ah"/></svg>`; };
    $('#gKinds').innerHTML = '<b>Wires</b>' + kinds.map(k => `<label class="chip"><input type="checkbox" data-kind="${esc(k)}"${kindOn[k] ? ' checked' : ''}>${swatch(k)}${esc(k)} <span class="ct">${kindN[k] || 0}</span></label>`).join('')
      + (hubList.length ? `<label class="chip h-ok" title="Each component's skill hub, from skillex graph"><input type="checkbox" data-hubs><svg class="sw" width="12" height="12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" transform="rotate(45 6 6)" style="fill:var(--panel);stroke:var(--hc);stroke-width:2"/></svg>skill hubs <span class="ct">${hubList.length}</span></label>` : '');
    $('#gDomains').innerHTML = '<b>Domains</b>' + ATLAS.domains.map(d => `<label class="chip" data-dom-hover="${esc(d.id)}"><input type="checkbox" data-dom="${esc(d.id)}" checked><span class="dot" style="background:${domColor(d.id)}"></span>${esc(d.name)} <span class="ct">${domN[d.id] || 0}</span></label>`).join('');
    $('#gKinds').addEventListener('change', e => { const i = e.target; if (i.dataset.kind) kindOn[i.dataset.kind] = i.checked; else if ('hubs' in i.dataset) hubsOn = i.checked; build(); });
    $('#gDomains').addEventListener('change', e => { const i = e.target; if (i.dataset.dom) domOn[i.dataset.dom] = i.checked; build(); });
    $('#gDomains').addEventListener('pointerover', e => { const c = e.target.closest('[data-dom-hover]'); if (c && e.pointerType === 'mouse' && hover?.dom !== c.dataset.domHover) { hover = { dom: c.dataset.domHover }; paint(); } });
    $('#gDomains').addEventListener('pointerout', e => { if (hover?.dom && !e.relatedTarget?.closest?.(`[data-dom-hover="${CSS.escape(hover.dom)}"]`)) { hover = null; paint(); } });

    // Seeded PRNG (mulberry32), so the starting scatter is the same on every load.
    const prng = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    function collide(nodes, pad) {
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j], min = a.r + b.r + pad;
        let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= min) continue;
        if (d < 1e-6) { dx = 1; dy = 0; d = 1; }
        const p = (min - d) / d * .5; a.x -= dx * p; a.y -= dy * p; b.x += dx * p; b.y += dy * p;
      }
    }
    // Force layout over ALL components and relations (filters only hide, never move), in two passes.

      const W = box.clientWidth, H = box.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight, lit = [...vnodes, ...vhubs].filter(n => n.hi);
      const cx = lit.reduce((s, n) => s + n.sx, 0) / (lit.length || 1), cy = lit.reduce((s, n) => s + n.sy, 0) / (lit.length || 1);
      const spots = [[8, 8], [W - tw - 8, 48], [8, H - th - 8], [W - tw - 8, H - th - 8]].map(([x, y]) => ({ x, y,
        hits: lit.filter(n => n.sx > x - 10 && n.sx < x + tw + 10 && n.sy > y - 10 && n.sy < y + th + 10).length,
        far: Math.hypot(x + tw / 2 - cx, y + th / 2 - cy) }));
      const best = spots.sort((a, b) => (a.hits - b.hits) || (b.far - a.far))[0];
      tip.style.left = best.x + 'px'; tip.style.top = best.y + 'px';
    }
    const local = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    function zoomAt(px, py, f) {
      const k = Math.min(kFit * 12, Math.max(kFit * .5, cam.k * f)), s = k / cam.k;
      cam = { k, x: px - (px - cam.x) * s, y: py - (py - cam.y) * s }; moved = true; schedule();
    }
    function fit() {
      const W = box.clientWidth, H = box.clientHeight; if (!W || !H || !world) return;
      const pts = [...(vnodes.length ? vnodes.map(n => n.w) : world.nodes), ...vhubs.map(h => h.w), ...vdoms.map(v => v.wd)];
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      pts.forEach(p => { x0 = Math.min(x0, p.x - p.r); y0 = Math.min(y0, p.y - p.r); x1 = Math.max(x1, p.x + p.r); y1 = Math.max(y1, p.y + p.r); });
      const side = Math.min(70, W * .1), k = Math.min((W - 2 * side) / Math.max(1, x1 - x0), (H - 64) / Math.max(1, y1 - y0), 2.5);
      cam = { k, x: (W - (x1 - x0) * k) / 2 - x0 * k, y: (H - (y1 - y0) * k) / 2 - y0 * k + 8 }; kFit = k; moved = false; schedule();
    }

    // Pan with a drag, zoom with the wheel or a pinch; a tap without a drag picks (or unpicks) a dot.
    const ptrs = new Map(); let down = null, pinch = null;
    svg.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 1) down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, t: e.target.closest('.gn, .gh'), moved: false };
      else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], [mx, my] = local({ clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 });
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: cam.k, wx: (mx - cam.x) / cam.k, wy: (my - cam.y) / cam.k }; if (down) down.moved = true; }
    });
    svg.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()], [mx, my] = local({ clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 });
        const k = Math.min(kFit * 12, Math.max(kFit * .5, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
        cam = { k, x: mx - pinch.wx * k, y: my - pinch.wy * k }; moved = true; schedule(); return; }
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      down.moved = true; moved = true; svg.classList.add('panning'); tip.hidden = true;
      cam = { ...cam, x: down.cx + dx, y: down.cy + dy }; schedule();
    });
    const up = e => {
      if (!ptrs.delete(e.pointerId)) return;
      if (ptrs.size < 2) pinch = null;
      if (ptrs.size === 1) { const [p] = [...ptrs.values()]; down = { x: p.x, y: p.y, cx: cam.x, cy: cam.y, t: null, moved: true }; return; }
      svg.classList.remove('panning');
      const d = down; down = null;
      if (!d || d.moved || e.type !== 'pointerup') return;
      if (d.t?.dataset.hub) { if (HUBS) window.open(`${HUBS.graph_page}#hub=${encodeURIComponent(d.t.dataset.hub)}`, '_blank', 'noopener'); return; }
      if (d.t?.dataset.id) { select(d.t.dataset.id === selected ? null : d.t.dataset.id); return; }
      if (selected) select(null);
    };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    svg.addEventListener('pointerover', e => {
      if (e.pointerType !== 'mouse' || ptrs.size) return;
      const t = e.target.closest('.gn, .gh'); if (!t) return;
      hover = t.dataset.id ? { node: t.dataset.id } : { hub: t.dataset.hub }; paint(); showTip(t);
    });
    svg.addEventListener('pointerout', e => {
      const t = e.target.closest('.gn, .gh'); if (!t || t.contains(e.relatedTarget)) return;
      if (hover && !hover.dom) { hover = null; paint(); } tip.hidden = true;
    });
    svg.addEventListener('focusin', e => { const t = e.target.closest('.gn, .gh'); if (!t) return; hover = t.dataset.id ? { node: t.dataset.id } : { hub: t.dataset.hub }; paint();
      showTip(t); });
    svg.addEventListener('focusout', () => { hover = null; tip.hidden = true; paint(); });
    svg.addEventListener('keydown', e => { const t = e.target.closest('.gn, .gh'); if (!t || (e.key !== 'Enter' && e.key !== ' ')) return; e.preventDefault();
      if (t.dataset.hub) { if (HUBS) window.open(`${HUBS.graph_page}#hub=${encodeURIComponent(t.dataset.hub)}`, '_blank', 'noopener'); } else select(t.dataset.id === selected ? null : t.dataset.id); });
    svg.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, Math.exp(-(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * .0016)); }, { passive: false });
    box.querySelector('.gzoom').addEventListener('click', e => { const z = e.target.closest('[data-z]')?.dataset.z; if (!z) return;
      if (z === 'fit') fit(); else zoomAt(box.clientWidth / 2, box.clientHeight / 2, z === 'in' ? 1.4 : 1 / 1.4); });
    $('#gCap').addEventListener('click', e => { if (e.target.closest('[data-to-detail]')) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); });

    // The layout depends only on the registry and the box's shape (aspect, bucketed), never on the clock.
    function show() {
      const W = box.clientWidth, H = box.clientHeight; if (!W || !H) return;
      if (!ready) init();
      const key = (Math.round(Math.min(1.8, Math.max(.6, W / H)) * 5) / 5).toFixed(1);
      if (key !== worldKey) { world = layout(+key); worldKey = key; build(); fit(); }
      else if (!moved) fit();
      schedule();
    }
    function reveal(id) {
      const c = byId[id]; if (!c || !ready) return;
      if (!domOn[c.domain]) { domOn[c.domain] = true; const i = document.querySelector(`#gDomains input[data-dom="${CSS.escape(c.domain)}"]`); if (i) i.checked = true; build(); }
      const n = at[id]; if (!n) return;
      const W = box.clientWidth, H = box.clientHeight;
      if (n.sx < 40 || n.sy < 40 || n.sx > W - 40 || n.sy > H - 40) { cam = { ...cam, x: W / 2 - n.w.x * cam.k, y: H / 2 - n.w.y * cam.k }; moved = true; schedule(); }
    }
    return { show, build, paint, reveal };
  })();

  const VIEWS = ['context', 'containers', 'graph', 'catalog', ...(HUBS ? ['hubs'] : [])];
  if (HUBS) document.querySelector('nav.views a[data-view="hubs"]').hidden = false;
  function route() {
    const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'containers';
    const was = curView; curView = v;
    document.querySelectorAll('nav.views a').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    ['context', 'containers', 'graph', 'catalog', 'hubs'].forEach(k => { $('#view-' + k).hidden = k !== v; });
    // One detail card serves the switchboard and the graph; it moves to whichever is showing.
    const host = $(`#view-${v === 'graph' ? 'graph' : 'containers'} .stage`), det = $('#detail');
    if (det.parentNode !== host) host.appendChild(det);
    if (was !== v) renderDetail();
    if (v === 'containers') requestAnimationFrame(paintSpot);
    if (v === 'graph') graph.show();
  }
  function renderAll() { renderLanes(); renderRows(); renderHubs(); paintSpot(); renderDetail(); graph.build(); }
  try { const s = localStorage.getItem('atlas.sel'); if (s && byId[s]) selected = s; } catch (_) {}
  renderContext(); renderAll(); route();
  addEventListener('hashchange', route);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { paintSpot(); if (curView === 'graph') graph.show(); }, 80); });
})();
</script>
