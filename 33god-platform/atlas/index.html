  $('#foot').innerHTML = `<span>Generated from the component registry · 33god-platform/components/*.yaml</span><span>digest ${esc(ATLAS.registry_digest.slice(0, 12))}</span><span>C4 source: atlas/c4.dsl</span>`;

  $('#statusChips').innerHTML = STATUSES.map(s => `<button class="chip" data-st="${s}" aria-pressed="${shown.has(s)}"><span class="st ${s}"></span>${STATUS_LABEL[s]}</button>`).join('');
  $('#statusChips').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (!b) return; const s = b.dataset.st; shown.has(s) ? shown.delete(s) : shown.add(s); b.setAttribute('aria-pressed', shown.has(s)); renderAll(); });
  $('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderAll(); });

  const matches = c => shown.has(c.status) && (!query || [c.id, c.name, c.summary, c.runtime, (c.tech || []).join(' '), ...(out[c.id] || []).map(e => e.via)].join(' ').toLowerCase().includes(query));
  const stPill = s => `<span class="st ${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;

  function renderLanes() {
    const lanes = ATLAS.domains.map(d => {
      const top = ATLAS.components.filter(c => c.domain === d.id && c.level !== 'component');
      const items = [];
      top.forEach(c => { const kids = (children[c.id] || []).filter(matches); if (matches(c) || kids.length) { items.push(tile(c, d.id)); kids.forEach(k => items.push(tile(k, d.id, true))); } });
      ATLAS.components.filter(c => c.domain === d.id && c.level === 'component' && !byId[c.parent]).filter(matches).forEach(c => items.push(tile(c, d.id, true)));
      if (!items.length) return '';
      const count = ATLAS.components.filter(c => c.domain === d.id).length;
      return `<div class="lane" style="--lc:${domColor(d.id)}"><h2>${esc(d.name)}<span class="n">${count}</span></h2><p class="ds">${esc(d.summary)}</p>${items.join('')}</div>`;
    }).join('');
    $('#lanes').innerHTML = lanes || '<p class="empty">Nothing matches. Clear the search or turn a status back on.</p>';
  }
  function tile(c, dom, child) {
    const cls = ['tile', child ? 'child' : '', c.first_party ? '' : 'ext'].join(' ');
    return `<button class="${cls}" data-id="${esc(c.id)}" style="--lc:${domColor(dom)}"><span class="nm">${esc(c.name)}${stPill(c.status)}</span><span class="k">${esc(c.kind)} · ${esc(c.id)}</span></button>`;
  }
  $('#lanes').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) select(t.dataset.id === selected ? null : t.dataset.id); });

  function select(id) {
    selected = id;
    try { localStorage.setItem('atlas.sel', id || ''); } catch (_) {}
    paintSpot(); renderDetail();
  }
  function relatedIds(id) {
    const ids = new Set([id, ...(children[id] || []).map(c => c.id)]);
    return ids;
  }
  function paintSpot() {
    const board = $('#board'), svg = $('#wires');
    board.classList.toggle('spot', !!selected);
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('on', 'lit', 'lit-in', 'lit-out'));
    svg.innerHTML = '';
    if (!selected) return;
    const mine = relatedIds(selected);
    const tileOf = id => document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`);
    const me = tileOf(selected); if (me) me.classList.add('on');
    const bb = board.getBoundingClientRect();
    const draw = (a, b, cls) => {
      const ta = tileOf(a), tb = tileOf(b); if (!ta || !tb || ta === tb) return;
      (cls === 'out' ? tb : ta).classList.add('lit', cls === 'out' ? 'lit-out' : 'lit-in');
      const ra = ta.getBoundingClientRect(), rb = tb.getBoundingClientRect();
      const ax = (ra.left + ra.right) / 2 - bb.left, ay = (ra.top + ra.bottom) / 2 - bb.top;
      const bx = (rb.left + rb.right) / 2 - bb.left, by = (rb.top + rb.bottom) / 2 - bb.top;
      const dx = Math.max(40, Math.abs(bx - ax) / 2);
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M${ax},${ay} C${ax + (bx >= ax ? dx : -dx)},${ay} ${bx - (bx >= ax ? dx : -dx)},${by} ${bx},${by}`);
      p.setAttribute('class', cls); svg.appendChild(p);
    };
    mine.forEach(id => { (out[id] || []).forEach(e => draw(selected, e.to, 'out')); (inc[id] || []).forEach(e => draw(e.from, selected, 'in')); });
  }
  function relList(list, dir) {
    if (!list.length) return '<p class="empty">None recorded.</p>';
    return `<ul class="rels ${dir}">` + list.map(e => { const other = dir === 'out' ? e.to : e.from; const o = byId[other];
      return `<li><span>${esc(e.kind)} <button data-go="${esc(other)}">${esc(o ? o.name : other)}</button></span><span class="via">${esc(e.via)}</span></li>`; }).join('') + '</ul>';
  }
  function renderDetail() {
    const el = $('#detail');
    if (!selected || !byId[selected]) {
      el.innerHTML = `<div class="eyebrow">Pick a part</div><h3>The switchboard</h3><p class="why">Every tile is one component. Pick one to light up its wires: orange for what it sends to or calls, blue for what reaches it. Then follow a wire to keep walking the system.</p><h4>Domains</h4><div style="display:grid;gap:6px">${ATLAS.domains.map(d => `<div style="font-size:13px"><span class="dot" style="background:${domColor(d.id)}"></span> <b>${esc(d.name)}</b> <span style="color:var(--ink-3)">${esc(d.summary)}</span></div>`).join('')}</div>`;
      return;
    }
    const c = byId[selected], d = ATLAS.domains[domIdx[c.domain]] || { name: c.domain };
    const mine = relatedIds(c.id);
    const o = [...mine].flatMap(id => out[id] || []), i = [...mine].flatMap(id => inc[id] || []);
    const kids = children[c.id] || [];
    const parent = c.parent && byId[c.parent];
    el.innerHTML = `
      <div class="eyebrow"><span><span class="dot" style="background:${domColor(c.domain)}"></span> ${esc(d.name)}</span><span>${esc(c.kind)}${c.first_party ? '' : ' · outside service'}</span>${stPill(c.status)}</div>
      <h3>${esc(c.name)}</h3>
      ${c.public_card && c.public_card.promise ? `<p class="lead"><b>${esc(c.public_card.title || '')}</b>${c.public_card.title ? '. ' : ''}${esc(c.public_card.promise)}</p>` : ''}
      <p class="lead">${esc(c.summary)}</p>
      ${c.role_in_system ? `<p class="why">${esc(c.role_in_system)}</p>` : ''}
      ${parent ? `<p class="why">Part of <button class="rels" style="all:unset;cursor:pointer;text-decoration:underline" data-go="${esc(parent.id)}">${esc(parent.name)}</button>.</p>` : ''}
      ${kids.length ? `<h4>Inside it</h4><div class="tags">${kids.map(k => `<button class="tag" data-go="${esc(k.id)}" style="cursor:pointer">${esc(k.name)}</button>`).join('')}</div>` : ''}
      ${(c.tech || []).length ? `<h4>Built with</h4><div class="tags">${c.tech.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${c.runtime ? `<h4>Runs as</h4><p class="mono">${esc(c.runtime)}</p>` : ''}
      <h4>Sends to / calls (${o.length})</h4>${relList(o, 'out')}
      <h4>Reached by (${i.length})</h4>${relList(i, 'in')}
      <p class="mono">id ${esc(c.id)}</p>`;
  }
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (!g) return; const id = g.dataset.go; if (location.hash !== '#containers') location.hash = 'containers'; query = ''; $('#q').value = ''; if (!shown.has(byId[id]?.status)) { shown.add(byId[id].status); renderAll(); } select(id); const t = document.querySelector(`.tile[data-id="${CSS.escape(id)}"]`); if (t) t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });

  function renderRows() {
    const dn = Object.fromEntries(ATLAS.domains.map(d => [d.id, d.name]));
    const list = ATLAS.components.filter(matches).sort((a, b) => (domIdx[a.domain] - domIdx[b.domain]) || a.name.localeCompare(b.name));
    $('#rows').innerHTML = list.map(c => `<tr data-go="${esc(c.id)}"><td class="id">${esc(c.id)}</td><td>${esc(c.name)}</td><td><span class="dot" style="background:${domColor(c.domain)}"></span> ${esc(dn[c.domain] || c.domain)}</td><td>${esc(c.kind)}</td><td>${stPill(c.status)}</td><td>${esc(c.summary)}</td><td style="font-variant-numeric:tabular-nums">${(out[c.id] || []).length}→ ${(inc[c.id] || []).length}←</td></tr>`).join('');
  }

  function renderContext() {
    const people = ATLAS.people;
    const ext = ATLAS.components.filter(c => !c.first_party && c.level !== 'component');
    const first = new Set(ATLAS.components.filter(c => c.first_party).map(c => c.id));
    const extCount = {};
    ATLAS.edges.forEach(e => { if (first.has(e.from) && byId[e.to] && !byId[e.to].first_party) extCount[e.to] = (extCount[e.to] || 0) + 1; if (first.has(e.to) && byId[e.from] && !byId[e.from].first_party) extCount[e.from] = (extCount[e.from] || 0) + 1; });
    const rowH = 34, H = Math.max(people.length * 70 + 60, ext.length * rowH + 60, 420), W = 1100;
    const sysX = 380, sysW = 340, sysY = 30, sysH = H - 60;
    let s = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
    s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">` + s;
    s += `<rect x="${sysX}" y="${sysY}" width="${sysW}" height="${sysH}" rx="10" fill="var(--paper)" stroke="currentColor" stroke-width="2"/>`;
    s += `<text x="${sysX + 18}" y="${sysY + 36}" font-family="Archivo, sans-serif" font-weight="800" font-size="26" fill="currentColor">33GOD</text>`;
    s += `<text x="${sysX + 18}" y="${sysY + 56}" font-size="12" fill="var(--ink-3)">${n.first_party} first-party parts in ${ATLAS.domains.length} domains</text>`;
    const dl = ATLAS.domains.filter(d => ATLAS.components.some(c => c.domain === d.id && c.first_party));
    const dh = Math.min(30, (sysH - 90) / Math.max(1, dl.length));
    dl.forEach((d, k) => { const y = sysY + 80 + k * dh; const cnt = ATLAS.components.filter(c => c.domain === d.id && c.first_party).length;
      s += `<rect x="${sysX + 18}" y="${y}" width="6" height="${dh - 8}" fill="${domColor(d.id)}"/><text x="${sysX + 32}" y="${y + dh / 2}" font-size="13" fill="currentColor">${esc(d.name)}</text><text x="${sysX + sysW - 18}" y="${y + dh / 2}" font-size="12" text-anchor="end" fill="var(--ink-3)">${cnt}</text>`; });
    const py = k => 60 + k * ((H - 120) / Math.max(1, people.length - 1 || 1));
    people.forEach((p, k) => { const y = people.length === 1 ? H / 2 : py(k);
      s += `<circle cx="70" cy="${y - 18}" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M50,${y + 14} q20,-26 40,0" fill="none" stroke="currentColor" stroke-width="2"/>`;
      s += `<text x="110" y="${y - 10}" font-weight="700" font-size="14" fill="currentColor">${esc(p.name)}</text>`;
      s += `<text x="110" y="${y + 8}" font-size="11" fill="var(--ink-3)">${esc((p.summary || '').slice(0, 44))}${(p.summary || '').length > 44 ? '…' : ''}</text>`;
      s += `<line x1="260" y1="${y}" x2="${sysX - 4}" y2="${y}" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/><text x="${(260 + sysX) / 2}" y="${y - 6}" font-size="11" text-anchor="middle" fill="var(--ink-3)">uses ${(p.uses || []).length} parts</text>`; });
    const ex0 = 60;
    ext.forEach((c, k) => { const y = ex0 + k * ((H - 100) / Math.max(1, ext.length - 1));
      s += `<line x1="${sysX + sysW + 4}" y1="${y}" x2="${W - 330}" y2="${y}" stroke="var(--ink-3)" stroke-width="1" marker-end="url(#ah)"/>`;
      s += `<rect x="${W - 322}" y="${y - 13}" width="300" height="26" rx="5" fill="var(--panel)" stroke="var(--ink-3)" stroke-dasharray="4 3"/>`;
      s += `<text x="${W - 312}" y="${y + 4}" font-size="13" fill="currentColor">${esc(c.name)}</text><text x="${W - 32}" y="${y + 4}" font-size="11" text-anchor="end" fill="var(--ink-3)">${extCount[c.id] || 0} wires</text>`; });
    s += '</svg>';
    $('#ctxSvg').outerHTML = s.replace('<svg ', '<svg id="ctxSvg" role="img" aria-label="System context: who uses 33GOD and which outside systems it depends on" ');
  }

  function route() {
    const v = ['context', 'containers', 'catalog'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'containers';
    document.querySelectorAll('nav.views a').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    ['context', 'containers', 'catalog'].forEach(k => { $('#view-' + k).hidden = k !== v; });
    if (v === 'containers') requestAnimationFrame(paintSpot);
  }
  function renderAll() { renderLanes(); renderRows(); paintSpot(); renderDetail(); }
  try { const s = localStorage.getItem('atlas.sel'); if (s && byId[s]) selected = s; } catch (_) {}
  renderContext(); renderAll(); route();
  addEventListener('hashchange', route);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(paintSpot, 80); });
})();
</script>
