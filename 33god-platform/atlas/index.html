      });
      vhubs = []; vhubEdges = [];
      if (hubsOn) world.hubs.forEach(w => {
        const comps = w.comps.filter(id => at[id]); if (!comps.length) return;
        const el = mk('g', { class: 'gh h-' + w.h.health, 'data-hub': w.h.name, tabindex: 0, role: 'link', 'aria-label': `Skill hub ${w.h.name}, ${w.h.health}` }, layers.hubs);
        mk('rect', { class: 'hb', x: -5, y: -5, width: 10, height: 10, transform: 'rotate(45)' }, el);
        const hn = { id: w.id, w, h: w.h, el, sr: 7, label: mk('text', { class: 'gl hub' }, layers.labels) };
        hn.label.textContent = w.h.name;
        comps.forEach(id => vhubEdges.push({ hub: hn, to: id, el: mk('path', { class: 'ghe h-' + w.h.health }, layers.hubEdges) }));
        vhubs.push(hn);
      });
      if (hover?.node && !at[hover.node]) hover = null;
      paint();
    }

    // Who is lit: the hovered (or picked) dot and its neighbours, a hovered hub and its parts, or a hovered domain.
    function focus() {
      const f = hover || (selected && at[selected] ? { node: selected } : null);
      if (!f) return null;
      const hi = new Set(), hh = new Set();
      if (f.node) { hi.add(f.node); vedges.forEach(v => { if (v.e.from === f.node) hi.add(v.e.to); if (v.e.to === f.node) hi.add(v.e.from); }); vhubEdges.forEach(v => { if (v.to === f.node) hh.add(v.hub.h.name); }); }
      else if (f.hub) { hh.add(f.hub); vhubEdges.forEach(v => { if (v.hub.h.name === f.hub) hi.add(v.to); }); }
      else if (f.dom) vnodes.forEach(n => { if (n.c.domain === f.dom) hi.add(n.id); });
      return { f, hi, hh };
    }
    function paint() {
      if (!ready || !world) return;
      const F = focus(), q = query;
      if (!hover || hover.dom) tip.hidden = true;
      vnodes.forEach(n => {
        n.match = !!q && textMatch(n.c);
        n.hi = F ? F.hi.has(n.id) : (!q || n.match);
        n.el.classList.toggle('match', n.match); n.el.classList.toggle('on', n.id === selected); n.el.classList.toggle('dim', !n.hi);
      });
      vedges.forEach(v => {
        const lit = !!F && (F.f.node ? v.e.from === F.f.node || v.e.to === F.f.node : F.f.dom ? byId[v.e.from].domain === F.f.dom && byId[v.e.to].domain === F.f.dom : false);
        v.el.classList.toggle('hi', lit); v.el.classList.toggle('dim', F ? !lit : !!q && !(at[v.e.from].match && at[v.e.to].match));
      });
      vhubs.forEach(h => { h.match = !!q && h.h.name.toLowerCase().includes(q); h.hi = F ? F.hh.has(h.h.name) : (!q || h.match); h.el.classList.toggle('dim', !h.hi); });
      vdoms.forEach(v => v.disc.classList.toggle('dim', F || q ? !vnodes.some(n => n.hi && n.c.domain === v.d.id) : false));
      vhubEdges.forEach(v => { const lit = !!F && (F.f.hub ? v.hub.h.name === F.f.hub : F.f.node ? v.to === F.f.node : false);
        v.el.classList.toggle('hi', lit); v.el.classList.toggle('dim', F ? !lit : !!q && !(v.hub.match || at[v.to].match)); });
      const sel = selected && at[selected] ? byId[selected] : null;
      $('#gCap').innerHTML = `<span><b>${vnodes.length}</b> of ${ATLAS.components.length} parts · <b>${vedges.length}</b> of ${ATLAS.edges.length} wires shown${q ? ` · <b>${vnodes.filter(n => n.match).length}</b> match the search` : ''}</span><span>Filled dot: ours · dashed ring: outside service · shoulder dot: status other than live, as in the chips · size: wires shown</span>`
        + (sel ? `<span class="to-detail">Picked <b>${esc(sel.name)}</b> · <button type="button" data-to-detail>see its card</button></span>` : '');
      schedule();
    }

    function schedule() { if (!raf) raf = requestAnimationFrame(render); }
    function wire(a, b, off, gap) {
      const flip = a.id > b.id, p = flip ? b : a, q = flip ? a : b;
      const dx = q.sx - p.sx, dy = q.sy - p.sy, L = Math.hypot(dx, dy);
      if (L < a.sr + b.sr + 3) return '';
      const mx = (a.sx + b.sx) / 2 - dy / L * off * 2, my = (a.sy + b.sy) / 2 + dx / L * off * 2;
      const ux = mx - a.sx, uy = my - a.sy, ul = Math.hypot(ux, uy), vx = b.sx - mx, vy = b.sy - my, vl = Math.hypot(vx, vy);
      const f = v => v.toFixed(1), x1 = a.sx + ux / ul * a.sr, y1 = a.sy + uy / ul * a.sr, x2 = b.sx - vx / vl * (b.sr + gap), y2 = b.sy - vy / vl * (b.sr + gap);
      return off ? `M${f(x1)} ${f(y1)}Q${f(mx)} ${f(my)} ${f(x2)} ${f(y2)}` : `M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`;
    }
    function render() {
      raf = 0;
      if (!ready || !world) return;
      const W = box.clientWidth, H = box.clientHeight, k = cam.k, grow = k <= 1 ? k : 1 + (k - 1) * .4;
      for (const n of vnodes) {
        n.sx = n.w.x * k + cam.x; n.sy = n.w.y * k + cam.y; n.sr = Math.max(3.2, n.r * grow);
        n.el.setAttribute('transform', `translate(${n.sx.toFixed(1)} ${n.sy.toFixed(1)})`);
        n.body.setAttribute('r', n.sr.toFixed(2)); n.ring.setAttribute('r', (n.sr + 3.2).toFixed(2));
        const br = Math.max(2.4, Math.min(3.4, n.sr * .4)), bx = n.sr * .72, by = -n.sr * .72;
        if (!n.sb) continue;
        if (n.sb.tagName === 'rect') { n.sb.setAttribute('x', (bx - br).toFixed(2)); n.sb.setAttribute('y', (by - br).toFixed(2)); n.sb.setAttribute('width', (2 * br).toFixed(2)); n.sb.setAttribute('height', (2 * br).toFixed(2)); }
        else { n.sb.setAttribute('cx', bx.toFixed(2)); n.sb.setAttribute('cy', by.toFixed(2)); n.sb.setAttribute('r', br.toFixed(2)); }
      }
      for (const h of vhubs) { h.sx = h.w.x * k + cam.x; h.sy = h.w.y * k + cam.y; h.el.setAttribute('transform', `translate(${h.sx.toFixed(1)} ${h.sy.toFixed(1)})`); }
      for (const v of vdoms) { v.sx = v.wd.x * k + cam.x; v.sy = v.wd.y * k + cam.y; v.sr = v.wd.r * k;
        v.disc.setAttribute('cx', v.sx.toFixed(1)); v.disc.setAttribute('cy', v.sy.toFixed(1)); v.disc.setAttribute('r', v.sr.toFixed(1)); }
      for (const v of vedges) v.el.setAttribute('d', wire(at[v.e.from], at[v.e.to], v.off, 1));
      for (const v of vhubEdges) v.el.setAttribute('d', wire(v.hub, at[v.to], 0, 1));
      labels(W, H);
    }

    // Labels: placed greedily, most-wired first, right / left / below / above the dot, never on top of
    // another label or a lit dot. What does not fit is dropped (hover it, search it or zoom in to see it).
    const ctx = document.createElement('canvas').getContext('2d');
    const bodyFont = getComputedStyle(document.documentElement).getPropertyValue('--font-body').trim() || 'sans-serif';
    let widths = {};
    const textW = (s, font) => widths[font + s] ??= (ctx.font = font, ctx.measureText(s).width);
    document.fonts?.ready.then(() => { widths = {}; schedule(); });
    function labels(W, H) {
      const F = focus(), placed = [], lit = [...vnodes, ...vhubs].filter(n => n.hi);
      const free = r => r.x > 2 && r.y > 2 && r.x + r.w < W - 2 && r.y + r.h < H - 2
        && !placed.some(p => r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y)
        && !lit.some(c => { const x = Math.max(r.x, Math.min(c.sx, r.x + r.w)), y = Math.max(r.y, Math.min(c.sy, r.y + r.h)); return (x - c.sx) ** 2 + (y - c.sy) ** 2 < (c.sr + 1.5) ** 2; });
      const put = (el, spots, force) => { const r = spots.find(free) || (force ? spots[0] : null);
        if (!r) { el.setAttribute('display', 'none'); return; }
        placed.push(r); el.removeAttribute('display'); el.setAttribute('x', (r.tx ?? r.x).toFixed(1)); el.setAttribute('y', (r.y + r.h - 3).toFixed(1)); };
      const dFont = `700 10.5px ${bodyFont}`, nFont = `600 11px ${bodyFont}`, hFont = `400 10.5px ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim() || 'monospace'}`;
      // Domain names sit on the rim of their island, only while nothing is focused or searched.
      vdoms.forEach(({ d, el, sx, sy, sr }) => {
        if (F && F.f.dom !== d.id || query) { el.setAttribute('display', 'none'); return; }
        const w = textW(d.name.toUpperCase(), dFont) * 1.13, h = 13, x = Math.min(Math.max(sx - w / 2, 4), W - w - 4);
        put(el, [{ x, tx: x + w / 2, y: sy - sr - h - 2, w, h }, { x, tx: x + w / 2, y: sy + sr + 3, w, h }, { x, tx: x + w / 2, y: sy - sr + 3, w, h }], false);
      });
      const pivot = F?.f.node || F?.f.hub && 'hub:' + F.f.hub;
      const items = [...vnodes, ...vhubs].sort((a, b) => ((b.id === pivot) - (a.id === pivot)) || (!!b.h - !!a.h) * -1 || ((b.match || 0) - (a.match || 0)) || ((b.deg || 0) - (a.deg || 0)) || (a.id < b.id ? -1 : 1));
      items.forEach(n => {
        if (!n.hi) { n.label.setAttribute('display', 'none'); return; }
        const w = textW(n.h ? n.h.name : n.c.name, n.h ? hFont : nFont), h = 13, gap = n.sr + 4;
        put(n.label, [{ x: n.sx + gap, y: n.sy - 7, w, h }, { x: n.sx - gap - w, y: n.sy - 7, w, h },
          { x: n.sx - w / 2, y: n.sy + n.sr + 2, w, h }, { x: n.sx - w / 2, y: n.sy - n.sr - 15, w, h }], n.id === pivot);
      });
    }

    // Tooltip, with the same facts a tile carries.
    function showTip(t) {
      if (!t) { tip.hidden = true; return; }
      if (t.dataset.hub) { const h = hubList.find(x => x.name === t.dataset.hub); if (!h) return;
        tip.style.setProperty('--dc', `var(--${{ ok: 'good', warning: 'warn' }[h.health] || 'bad'})`);
        tip.innerHTML = `<b>${esc(h.name)}</b><span class="k">skill hub · ${esc(h.source || 'no source')}</span><span>${hubPill(h.health)} · ${h.findings} finding${h.findings === 1 ? '' : 's'}</span>${h.subskills.length ? `<span>${h.subskills.length} sub-skills: ${esc(h.subskills.slice(0, 6).join(', '))}${h.subskills.length > 6 ? '…' : ''}</span>` : ''}<span class="k">click to open it in the skill graph</span>`;
      } else { const c = byId[t.dataset.id]; if (!c) return; const o = vedges.filter(v => v.e.from === c.id).length, i = vedges.filter(v => v.e.to === c.id).length;
        tip.style.setProperty('--dc', domColor(c.domain));
        tip.innerHTML = `<b>${esc(c.name)}</b><span class="k">${esc(c.kind)} · ${esc(domName[c.domain] || c.domain)}${c.first_party ? '' : ' · outside service'}</span><span>${stPill(c.status)} · ${o} out · ${i} in shown</span><span>${esc(c.summary.length > 150 ? c.summary.slice(0, 149) + '…' : c.summary)}</span>`; }
      tip.hidden = false;
      // Park it in the corner that hides the fewest lit dots, so it never covers the neighbourhood it describes.
      const W = box.clientWidth, H = box.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight, lit = [...vnodes, ...vhubs].filter(n => n.hi);
      const cx = lit.reduce((s, n) => s + n.sx, 0) / (lit.length || 1), cy = lit.reduce((s, n) => s + n.sy, 0) / (lit.length || 1);
      const spots = [[8, 8], [W - tw - 8, 48], [8, H - th - 8], [W - tw - 8, H - th - 8]].map(([x, y]) => ({ x, y,
        hits: lit.filter(n => n.sx > x - 10 && n.sx < x + tw + 10 && n.sy > y - 10 && n.sy < y + th + 10).length,
        far: Math.hypot(x + tw / 2 - cx, y + th / 2 - cy) }));
      const best = spots.sort((a, b) => (a.hits - b.hits) || (b.far - a.far))[0];
      tip.style.left = best.x + 'px'; tip.style.top = best.y + 'px';
    }
    const local = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    function zoomAt(px, py, f) {
      const k = Math.min(kFit * 12, Math.max(kFit * .5, cam.k * f)), s = k / cam.k;
      cam = { k, x: px - (px - cam.x) * s, y: py - (py - cam.y) * s }; moved = true; schedule();
    }
    function fit() {
      const W = box.clientWidth, H = box.clientHeight; if (!W || !H || !world) return;
      const pts = [...(vnodes.length ? vnodes.map(n => n.w) : world.nodes), ...vhubs.map(h => h.w), ...vdoms.map(v => v.wd)];
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      pts.forEach(p => { x0 = Math.min(x0, p.x - p.r); y0 = Math.min(y0, p.y - p.r); x1 = Math.max(x1, p.x + p.r); y1 = Math.max(y1, p.y + p.r); });
      const side = Math.min(70, W * .1), k = Math.min((W - 2 * side) / Math.max(1, x1 - x0), (H - 64) / Math.max(1, y1 - y0), 2.5);
      cam = { k, x: (W - (x1 - x0) * k) / 2 - x0 * k, y: (H - (y1 - y0) * k) / 2 - y0 * k + 8 }; kFit = k; moved = false; schedule();
    }

    // Pan with a drag, zoom with the wheel or a pinch; a tap without a drag picks (or unpicks) a dot.
    const ptrs = new Map(); let down = null, pinch = null;
    svg.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 1) down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, t: e.target.closest('.gn, .gh'), moved: false };
      else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], [mx, my] = local({ clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 });
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: cam.k, wx: (mx - cam.x) / cam.k, wy: (my - cam.y) / cam.k }; if (down) down.moved = true; }
    });
    svg.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()], [mx, my] = local({ clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 });
        const k = Math.min(kFit * 12, Math.max(kFit * .5, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
        cam = { k, x: mx - pinch.wx * k, y: my - pinch.wy * k }; moved = true; schedule(); return; }
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      down.moved = true; moved = true; svg.classList.add('panning'); tip.hidden = true;
      cam = { ...cam, x: down.cx + dx, y: down.cy + dy }; schedule();
    });
    const up = e => {
      if (!ptrs.delete(e.pointerId)) return;
      if (ptrs.size < 2) pinch = null;
      if (ptrs.size === 1) { const [p] = [...ptrs.values()]; down = { x: p.x, y: p.y, cx: cam.x, cy: cam.y, t: null, moved: true }; return; }
      svg.classList.remove('panning');
      const d = down; down = null;
      if (!d || d.moved || e.type !== 'pointerup') return;
      if (d.t?.dataset.hub) { if (HUBS) window.open(`${HUBS.graph_page}#hub=${encodeURIComponent(d.t.dataset.hub)}`, '_blank', 'noopener'); return; }
      if (d.t?.dataset.id) { select(d.t.dataset.id === selected ? null : d.t.dataset.id); return; }
      if (selected) select(null);
    };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    svg.addEventListener('pointerover', e => {
      if (e.pointerType !== 'mouse' || ptrs.size) return;
      const t = e.target.closest('.gn, .gh'); if (!t) return;
      hover = t.dataset.id ? { node: t.dataset.id } : { hub: t.dataset.hub }; paint(); showTip(t);
    });
    svg.addEventListener('pointerout', e => {
      const t = e.target.closest('.gn, .gh'); if (!t || t.contains(e.relatedTarget)) return;
      if (hover && !hover.dom) { hover = null; paint(); } tip.hidden = true;
    });
    svg.addEventListener('focusin', e => { const t = e.target.closest('.gn, .gh'); if (!t) return; hover = t.dataset.id ? { node: t.dataset.id } : { hub: t.dataset.hub }; paint();
      showTip(t); });
    svg.addEventListener('focusout', () => { hover = null; tip.hidden = true; paint(); });
    svg.addEventListener('keydown', e => { const t = e.target.closest('.gn, .gh'); if (!t || (e.key !== 'Enter' && e.key !== ' ')) return; e.preventDefault();
      if (t.dataset.hub) { if (HUBS) window.open(`${HUBS.graph_page}#hub=${encodeURIComponent(t.dataset.hub)}`, '_blank', 'noopener'); } else select(t.dataset.id === selected ? null : t.dataset.id); });
    svg.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, Math.exp(-(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * .0016)); }, { passive: false });
    box.querySelector('.gzoom').addEventListener('click', e => { const z = e.target.closest('[data-z]')?.dataset.z; if (!z) return;
      if (z === 'fit') fit(); else zoomAt(box.clientWidth / 2, box.clientHeight / 2, z === 'in' ? 1.4 : 1 / 1.4); });
    $('#gCap').addEventListener('click', e => { if (e.target.closest('[data-to-detail]')) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); });

    // The layout depends only on the registry and the box's shape (aspect, bucketed), never on the clock.
    function show() {
      const W = box.clientWidth, H = box.clientHeight; if (!W || !H) return;
      if (!ready) init();
      const key = (Math.round(Math.min(1.8, Math.max(.6, W / H)) * 5) / 5).toFixed(1);
      if (key !== worldKey) { world = layout(+key); worldKey = key; build(); fit(); }
      else if (!moved) fit();
      schedule();
    }
    function reveal(id) {
      const c = byId[id]; if (!c || !ready) return;
      if (!domOn[c.domain]) { domOn[c.domain] = true; const i = document.querySelector(`#gDomains input[data-dom="${CSS.escape(c.domain)}"]`); if (i) i.checked = true; build(); }
      const n = at[id]; if (!n) return;
      const W = box.clientWidth, H = box.clientHeight;
      if (n.sx < 40 || n.sy < 40 || n.sx > W - 40 || n.sy > H - 40) { cam = { ...cam, x: W / 2 - n.w.x * cam.k, y: H / 2 - n.w.y * cam.k }; moved = true; schedule(); }
    }
    return { show, build, paint, reveal };
  })();

  const VIEWS = ['context', 'containers', 'graph', 'catalog', ...(HUBS ? ['hubs'] : [])];
  if (HUBS) document.querySelector('nav.views a[data-view="hubs"]').hidden = false;
  function route() {
    const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'containers';
    const was = curView; curView = v;
    document.querySelectorAll('nav.views a').forEach(a => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    ['context', 'containers', 'graph', 'catalog', 'hubs'].forEach(k => { $('#view-' + k).hidden = k !== v; });
    // One detail card serves the switchboard and the graph; it moves to whichever is showing.
    const host = $(`#view-${v === 'graph' ? 'graph' : 'containers'} .stage`), det = $('#detail');
    if (det.parentNode !== host) host.appendChild(det);
    if (was !== v) renderDetail();
    if (v === 'containers') requestAnimationFrame(paintSpot);
    if (v === 'graph') graph.show();
  }
  function renderAll() { renderLanes(); renderRows(); renderHubs(); paintSpot(); renderDetail(); graph.build(); }
  try { const s = localStorage.getItem('atlas.sel'); if (s && byId[s]) selected = s; } catch (_) {}
  renderContext(); renderAll(); route();
  addEventListener('hashchange', route);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { paintSpot(); if (curView === 'graph') graph.show(); }, 80); });
})();
</script>
