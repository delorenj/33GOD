version: 1
product:
  id: 33god
  name: 33GOD Productized Development Environment
  mode: local-first-cloud-blocked
  visibility: private-source
  summary: >
    Event-driven agentic development platform composed from independently
    versioned repos and coordinated by this control plane.

profiles:
  default:
    description: Validated local target; Bloodbank core, one Candystore, Holocene API preflight, and Holocene web.
    includes: [core, audit, control]
  tools:
    description: Default target plus zero-replica, run-only PJangler CLI and stdio MCP tools.
    includes: [core, audit, control, provisioning-tools]
  full:
    description: Current local full model; identical to tools until more optional services are governed.
    includes: [core, audit, control, provisioning-tools]
  cloud:
    description: Render-only unsupported local-bind model with an explicit rejection gate; never start it.
    includes: [unsupported]

compose_projection:
  owner: 33god-platform
  file: compose.yaml
  state: validated-target-not-live-cutover
  source_root_env: GOD_SOURCE_ROOT
  source_root_default: ..
  semantic_validator: scripts/validate-compose.py
  prohibitions:
    - never use the Bloodbank legacy Candystore profile
    - never expose a lifecycle surface for the cloud profile
    - never use docker compose down -v
    - never remove adopted or detached legacy volumes during migration

component_files:
  - components/bloodbank.yaml
  - components/candystore.yaml
  - components/holocene.yaml
  - components/pjangler.yaml
  - components/hermes-fleet.yaml
  - components/skillex.yaml
  - components/hindsight.yaml
  - components/pipeline-mcp-hub.yaml
  - components/candybar.yaml
  - components/heyma.yaml

contract_paths:
  - ../bloodbank/docs/event-naming.md
  - ../bloodbank/schemas
  - ../bloodbank/services/agent-hooks/hooks.master.json
  - ../candystore/migrations
  - ../holocene/docs
  - ../pipeline-mcp-hub/README.md
  - ../pjangler/templates
  - ../../skillex/all-skills
  - ../hermes-agent-template

change_policy:
  machine_log: changes/*.jsonl
  human_log: CHANGELOG.pipeline.md
  required_for:
    - event schema or subject changes
    - agent hook entrypoint or payload changes
    - project template or provisioning changes
    - Hermes fleet runtime/profile contract changes
    - skill hub routing changes
    - compose/network/port/secret boundary changes
