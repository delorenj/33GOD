version: 1
product:
  id: 33god
  name: 33GOD Productized Development Environment
  mode: local-first-cloud-blocked
  visibility: private-source
  summary: >
    Event-driven agentic development platform composed from independently
    versioned repos and coordinated by this control plane.

profiles:
  default:
    description: Validated local target; Bloodbank core, one Candystore, Holocene API preflight, and Holocene web.
    includes: [core, audit, control]
  tools:
    description: Default target plus zero-replica, run-only PJangler CLI and stdio MCP tools.
    includes: [core, audit, control, provisioning-tools]
  full:
    description: Current local full model; identical to tools until more optional services are governed.
    includes: [core, audit, control, provisioning-tools]
  cloud:
    description: Render-only unsupported local-bind model with an explicit rejection gate; never start it.
    includes: [unsupported]

compose_projection:
  owner: 33god-platform
  file: compose.yaml
  state: validated-target-not-live-cutover
  source_root_env: GOD_SOURCE_ROOT
  source_root_default: ..
  semantic_validator: scripts/validate-compose.py
  prohibitions:
    - never use the Bloodbank legacy Candystore profile
    - never expose a lifecycle surface for the cloud profile
    - never use docker compose down -v
    - never remove adopted or detached legacy volumes during migration

# Component records: every components/*.yaml (one registry, I-12). No list to keep in sync.

contract_paths:
  - ../bloodbank/docs/event-naming.md
  - ../bloodbank/schemas
  - ../bloodbank/services/agent-hooks/hooks.master.json
  - ../candystore/migrations
  - ../holocene/docs
  - ../mcp-hub/README.md
  - ../pjangler/templates
  - ../flume/contracts/handbook.yaml
  - ../krebs/adapters/tp
  - ../../skillex/all-skills
  - ../hermes-agent-template

change_policy:
  machine_log: changes/*.jsonl
  human_log: CHANGELOG.pipeline.md
  required_for:
    - event schema or subject changes
    - agent hook entrypoint or payload changes
    - project template or provisioning changes
    - Hermes fleet runtime/profile contract changes
    - skill hub routing changes
    - compose/network/port/secret boundary changes

# --- Atlas (I-12): domain taxonomy and C4 people, rendered by scripts/atlas.py ---
domains:
- id: G1
  name: Bloodbank Core Bus
  summary: The NATS JetStream event bus, its CloudEvents contract, schemas and the Candystore audit store.
- id: G2
  name: Integration Plane
  summary: n8n workflows and webhooks that turn outside events (Plane tickets, journals) into bus events.
- id: G3
  name: Agent Fleet Runtime
  summary: The Hermes gateway and agent profiles, plus the hook pipeline that reports what agents are doing.
- id: G4
  name: Observability
  summary: Metrics, alerts, exporters and daily reports that show platform health.
- id: G5
  name: Project Tooling
  summary: Project registry, skill catalog, shared project scaffolding and MCP hub used by every repo.
- id: G6
  name: Voice Pipeline
  summary: 'HeyMa: dictation, transcription, intake and text-to-speech.'
- id: G7
  name: Enrichment and Memory
  summary: 'LLM-touching services: embeddings, turn annotation, cost tracking, agent memory and LLM routing.'
- id: G8
  name: Orchestration and Apps
  summary: Ticket dispatch (Krebs), workforce (Flume), ticket CLI (Pilot) and the Holocene operator app.
- id: G9
  name: Scheduling
  summary: Candybar, the single clock that fires every recurring job.
- id: G10
  name: Operator Desktop
  summary: 'Tools that live only on the operator''s workstation: workspace, attention, voice relay, crank.'
- id: G11
  name: Client Surface
  summary: 'What external clients touch: the Genesis liaison, client portal and billing.'
- id: G12
  name: Shared Infra
  summary: 'Third-party infrastructure the platform runs on: databases, proxy, tunnels, secrets, object store.'
people:
- id: operator
  name: Operator
  summary: The solo owner who runs the platform, steers agents and reviews results.
  uses:
  - bb-cli
  - client-portal
  - daily-report
  - deckard
  - genesis
  - heyma
  - holocene
  - pilot
  - wingman
- id: client
  name: Client
  summary: Someone who leases a 33GOD agent and talks to it through their Genesis desk.
  uses:
  - genesis
  - genesis-desk-worker
- id: mirror-operator
  name: Mirror-site operator
  summary: A collaborator who runs a mirrored copy of the platform on their own machine.
  uses:
  - bloodbank
  - hook-hub
  - candystore
- id: voice-user
  name: Voice user
  summary: Someone dictating or sending voice memos into the platform.
  uses:
  - vinyl
  - inbox-watcher
  - vox
