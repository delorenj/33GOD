version: 1
product:
  id: 33god
  name: 33GOD Productized Development Environment
  mode: local-first-cloud-blocked
  visibility: private-source
  summary: >
    Event-driven agentic development platform composed from independently
    versioned repos and coordinated by this control plane.

profiles:
  default:
    description: Validated local target; Bloodbank core, one Candystore, Holocene API preflight, and Holocene web.
    includes: [core, audit, control]
  tools:
    description: Default target plus zero-replica, run-only PJangler CLI and stdio MCP tools.
    includes: [core, audit, control, provisioning-tools]
  full:
    description: Current local full model; identical to tools until more optional services are governed.
    includes: [core, audit, control, provisioning-tools]
  cloud:
    description: Render-only unsupported local-bind model with an explicit rejection gate; never start it.
    includes: [unsupported]

compose_projection:
  owner: 33god-platform
  file: compose.yaml
  state: validated-target-not-live-cutover
  source_root_env: GOD_SOURCE_ROOT
  source_root_default: ..
  semantic_validator: scripts/validate-compose.py
  prohibitions:
    - never use the Bloodbank legacy Candystore profile
    - never expose a lifecycle surface for the cloud profile
    - never use docker compose down -v
    - never remove adopted or detached legacy volumes during migration

# Component records: every components/*.yaml (one registry, I-12). No list to keep in sync.

contract_paths:
  - ../bloodbank/docs/event-naming.md
  - ../bloodbank/schemas
  - ../bloodbank/services/agent-hooks/hooks.master.json
  - ../candystore/migrations
  - ../holocene/docs
  - ../mcp-hub/README.md
  - ../pjangler/templates
  - ../flume/contracts/handbook.yaml
  - ../krebs/adapters/tp
  - ../../skillex/all-skills
  - ../hermes-agent-template

change_policy:
  machine_log: changes/*.jsonl
  human_log: CHANGELOG.pipeline.md
  required_for:
    - event schema or subject changes
    - agent hook entrypoint or payload changes
    - project template or provisioning changes
    - Hermes fleet runtime/profile contract changes
    - skill hub routing changes
    - compose/network/port/secret boundary changes

# --- Atlas (I-12): domain taxonomy and C4 people, rendered by scripts/atlas.py ---
domains:
- id: G1
  name: Bloodbank Core Bus
  summary: The NATS JetStream event bus, its CloudEvents contract, schemas and the Candystore audit store.
- id: G2
  name: Integration Plane
  summary: n8n workflows and webhooks that turn outside events (Plane tickets, journals) into bus events.
- id: G3
  name: Agent Fleet Runtime
  summary: The Hermes gateway and agent profiles, plus the hook pipeline that reports what agents are doing.
- id: G4
  name: Observability
  summary: Metrics, alerts, exporters and daily reports that show platform health.
- id: G5
  name: Project Tooling
  summary: Project registry, skill catalog, shared project scaffolding and MCP hub used by every repo.
- id: G6
  name: Voice Pipeline
  summary: 'HeyMa: dictation, transcription, intake and text-to-speech.'
- id: G7
  name: Enrichment and Memory
  summary: 'LLM-touching services: embeddings, turn annotation, cost tracking, agent memory and LLM routing.'
- id: G8
  name: Orchestration and Apps
  summary: Ticket dispatch (Krebs), workforce (Flume), ticket CLI (Pilot) and the Holocene operator app.
- id: G9
  name: Scheduling
  summary: Candybar, the single clock that fires every recurring job.
- id: G10
  name: Operator Desktop
  summary: 'Tools that live only on the operator''s workstation: workspace, attention, voice relay, crank.'
- id: G11
  name: Client Surface
  summary: 'What external clients touch: the Genesis liaison, client portal and billing.'
- id: G12
  name: Shared Infra
  summary: 'Third-party infrastructure the platform runs on: databases, proxy, tunnels, secrets, object store.'
- id: G13
  name: Marketing
  summary: 'The public face: the launch page, the picture manuals and the showcase pages that explain the platform to people outside it.'
people:
- id: operator
  name: Operator
  summary: The solo owner who runs the platform, steers agents and reviews results.
  uses:
  - bb-cli
  - client-portal
  - daily-report
  - deckard
  - genesis
  - heyma
  - holocene
  - pilot
  - wingman
- id: client
  name: Client
  summary: Someone who leases a 33GOD agent and talks to it through their Genesis desk.
  uses:
  - genesis
  - genesis-desk-worker
- id: mirror-operator
  name: Mirror-site operator
  summary: A collaborator who runs a mirrored copy of the platform on their own machine.
  uses:
  - bloodbank
  - hook-hub
  - candystore
- id: voice-user
  name: Voice user
  summary: Someone dictating or sending voice memos into the platform.
  uses:
  - vinyl
  - inbox-watcher
  - vox

# Factory extras (Factory floor, manual/sandbox): ids a waybill or the old floor table can name that are NOT
# registry components (vendor CLIs and the devices around them). Each stands at a `station` or in a kiosk `near`
# one, exactly like a component's `factory:` block, and may list `aliases` (other ids for the same extra).
# A bay may also claim `surfaces` (source:<ce-source-glob>[#<type-glob>] or producer:<glob>), like a component's own:
# the vendor CLI's events stand at its bay while agent-hooks keeps the hook events (a typed source rule goes first).
# Rendered into src/cast.generated.json by atlas.py.
factory_extras:
  ext:antigravity: {station: bays, name: Antigravity CLI, aliases: [antigravity-cli, ext:antigravity-cli], surfaces: ['source:urn:33god:agent:antigravity-cli']}
  ext:claude-code: {station: bays, name: Claude Code, surfaces: ['source:urn:33god:agent:claude-code']}
  ext:codex: {station: bays, name: Codex}
  ext:codex-cli: {station: bays, name: Codex CLI, surfaces: ['source:urn:33god:agent:codex-cli']}
  ext:codex-desktop: {station: bays, name: Codex Desktop}
  ext:codex-exec: {station: bays, name: Codex exec (headless)}
  ext:copilot: {station: bays, name: GitHub Copilot CLI, aliases: [copilot-cli, ext:copilot-cli], surfaces: ['source:urn:33god:agent:copilot*']}
  ext:gemini: {station: bays, name: Gemini CLI, surfaces: ['source:urn:33god:agent:gemini']}
  ext:kimi: {station: bays, name: Kimi CLI, surfaces: ['source:urn:33god:agent:kimi']}
  ext:opencode: {station: bays, name: opencode CLI, surfaces: ['source:urn:33god:agent:opencode']}
  ext:unknown: {station: bays, name: Unknown agent CLI}
  ext:codex-mcp-helper-reaper: {near: bays, name: codex-mcp-helper-reaper}
  ext:hook-command: {near: bays, name: Other hook command}
  ext:nanoleaf: {near: bays, name: Nanoleaf panels}
  ext:stream-deck: {near: bays, name: Stream Deck}
  ext:zellij: {near: bays, name: Zellij}
  zellij-notify: {near: bays, name: zellij-notify}
  # Decision I-10.2 (c): product and client projects that publish on the bus are tenants, not components.
  # Every tenant stands at this one annex, keyed by project slug (`tenant:<slug>`); the slugs come from the
  # `tenant:` field of their atlas_ignore producer rows below.
  tenant-annex: {near: entrance, name: Tenant annex}
  unknown: {near: belt, name: Unattributed span}
  waybill: {near: belt, name: Waybill recorder}

# Which component is this event? One resolver, rendered by atlas.py into src/cast.generated.json (`resolve`)
# and read by both waybill/waybill/registry.py and src/waybill/resolve.ts. First match wins:
#   1. source:   a component's `source:<ce-source-glob>[#<type-glob>]` surfaces. A relay claim: the event
#                belongs to the claimant whoever published it. <ce-source-glob> matches the CloudEvent `source`
#                attribute (`*` = any publisher); <type-glob> matches the event type without its `bloodbank.`
#                prefix. Rules with a type part go first, then longer patterns.
#   2. tenant:   an atlas_ignore producer row with `tenant:` -> `tenant:<slug>` at the tenant annex.
#   3. desk:     a factory_desks family (one desk per instance; see below).
#   4. producer: a component's `producer:<name or glob>` surfaces; exact names before globs, longer globs first.
#   5. id:       a producer spelled like a registry id, an alias or an extra.
#   6. `unknown` (never dropped: a waybill lists it in a finding).
# Globs use `*` and `?` only, so Python's fnmatch and the player's matcher agree.

# Desk families: a producer prefix whose rest names one instance. Each well-formed instance stands at its own
# desk (`<family>:<instance>`, a kiosk `near` its station); `routes` send matching instances to a registry
# component instead; bare producers, `malformed` names and names that fail `instance` go to `<family>:unknown`.
# `owner` is the registry component that answers for every desk (what the night digest credits).
factory_desks:
  hermes-desk:
    owner: hermes-fleet
    producer: "hermes-agent:"
    bare: [hermes-agent]
    near: crew
    name: Hermes desk
    instance: "^[a-z0-9][a-z0-9-]*$"
    # Spelled like a profile, but no Hermes profile carries the name (a misread HERMES_HOME or a relayed CLI).
    malformed: [runtime]
    routes:
      "*-momo": momo
      # The default profile (HERMES_HOME at the standalone root) and a Claude Code relay spelled like a profile:
      # both are the one gateway process speaking, not a desk of their own.
      ".hermes": hermes-gw
      "claude-code": hermes-gw

# Surfaces the drift audit (`atlas.py audit --live`) sees on the host that are NOT
# 33GOD components: the desktop session, household services, and the client and
# product projects that run on 33GOD. A component claims its own surfaces in its
# record (`surfaces:`); everything else must be listed here with a reason, or the
# audit reports it as unregistered. Patterns are shell globs.
atlas_ignore:
  - {kind: systemd, pattern: "org.gnome.*", reason: desktop session}
