# Aperture G7 — Memory + Enrichment plane (self-contained Compose bundle)
#
# WHAT: candystore envelope store (vendored from the monorepo submodule),
# enrichment worker (one REAL deterministic extraction pass -> derived
# canonical events with causationid = source id), hindsight-bridge (pluggable
# external memory backends; client-owned LLM endpoints, EMPTY defaults,
# degraded-not-crashed), a reference memory backend (SQLite FTS5), an owned
# NATS JetStream bus for standalone proof, ntfy (optional `notify` profile).
#
# ZERO AAI: no AAI-gateway content, endpoints, keys or references anywhere in
# this bundle. GOD_LLM_* is a client-owned config surface with EMPTY defaults.
#
# COLLISION SAFETY (G1 conventions): compose project locked to `god-g7`,
# no container_name, NO published host ports (in-network only; inspect via
# `docker compose exec` or SSH tunnel), own volumes/networks prefixed g7-.
#
# CRIB SOURCES (do not drift):
#   - candystore-src/  — vendored byte-copy of the candystore submodule
#     (package, migrations, static, tests, pyproject, Dockerfile) at commit
#     767ebb5eb8351b43b43bb6406aa1882ef3912713; see candystore-src/PROVENANCE.md.
#   - groups/g1/nats/{streams.json,init.sh} — stream topology + init script
#     (copied, stream set reduced to the bloodbank ones G7 needs).
#   - groups/g1/dapr/pubsub.yaml — verbatim pubsub.jetstream component.
#   - groups/g3/compose.yml — ntfy pattern (notify profile).

name: god-g7

networks:
  g7-internal:
    name: g7-internal
    driver: bridge
  g7-bus:
    # Standalone bus. In attached mode (compose.attach.yml) the enrichment
    # worker + hindsight-bridge + candystore-daprd join the EXTERNAL bus
    # network instead; this one stays owned and empty of publishers.
    name: g7-bus
    driver: bridge

volumes:
  nats-data:
    name: god-g7-nats-data
  candystore-pgdata:
    name: god-g7-candystore-pgdata
  enrichment-data:
    name: god-g7-enrichment-data
  memory-data:
    name: god-g7-memory-data
  ntfy-cache:
    name: god-g7-ntfy-cache
  ntfy-data:
    name: god-g7-ntfy-data

services:
  # ------------------------------------------------------------------ bus ---
  bus:
    # Owned JetStream broker for standalone proof (crib: G1 nats service).
    # Attached mode retargets the workers to the external bus via
    # GOD_BUS_NATS_URL and joins the external network instead.
    image: ${GOD_NATS_IMAGE:-nats:2.10-alpine}
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet --timeout=3 http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.25
    networks:
      g7-bus:
        aliases: [nats]
    restart: unless-stopped

  nats-init:
    # One-shot: applies ./nats/streams.json (G7-scoped copy of G1's topology:
    # BLOODBANK_EVENTS + BLOODBANK_COMMANDS only — GIB_EVENTS is not this
    # plane's concern). Crib verbatim from g1/nats/init.sh.
    image: ${GOD_NATS_BOX_IMAGE:-natsio/nats-box:0.14.5}
    depends_on:
      bus:
        condition: service_healthy
    environment:
      NATS_URL: ${GOD_NATS_URL:-nats://nats:4222}
    volumes:
      - type: bind
        source: ./nats/streams.json
        target: /work/streams.json
        read_only: true
      - type: bind
        source: ./nats/init.sh
        target: /work/init.sh
        read_only: true
    entrypoint: ["/bin/sh", "/work/init.sh"]
    networks: [g7-bus]
    restart: "no"

  # ----------------------------------------------------------- candystore ---
  candystore-postgres:
    # pgvector image required: candystore migration 010 creates
    # CREATE EXTENSION vector + HNSW index (same constraint as G1). The task
    # spec said postgres:17-alpine; plain postgres lacks the vector extension,
    # so the pgvector pg17 build is the honest pin (see README deviations).
    image: ${GOD_POSTGRES_IMAGE:-pgvector/pgvector:0.8.0-pg17}
    environment:
      POSTGRES_USER: ${GOD_POSTGRES_USER:-candystore}
      POSTGRES_PASSWORD: ${GOD_POSTGRES_PASSWORD:-candystore}
      POSTGRES_DB: ${GOD_POSTGRES_DB:-candystore}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=25]
    volumes:
      - candystore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOD_POSTGRES_USER:-candystore} -d ${GOD_POSTGRES_DB:-candystore}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    networks:
      g7-internal:
        aliases: [postgres]
    restart: unless-stopped

  candystore:
    # Durable Bloodbank event audit trail. BUILT from the vendored
    # candystore-src/ (monorepo submodule copy at 767ebb5) — G1 builds from
    # the live submodule, G7 vendors so the bundle is self-contained.
    build:
      context: ./candystore-src
    image: ${GOD_CANDYSTORE_IMAGE:-candystore:g7}
    environment:
      APP_PORT: "3001"
      APP_HOST: 0.0.0.0
      # Alias `postgres` resolves on g7-internal in BOTH modes.
      DATABASE_URL: postgresql://${GOD_POSTGRES_USER:-candystore}:${GOD_POSTGRES_PASSWORD:-candystore}@postgres:5432/${GOD_POSTGRES_DB:-candystore}
      SUBSCRIBE_PUBSUB: bloodbank-pubsub
      SUBSCRIBE_TOPIC: bloodbank.evt.>
      SUBSCRIBE_ROUTE: /events/all
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      candystore-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/readyz', timeout=3)\""]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 5s
    mem_limit: 192m
    cpus: 0.5
    networks:
      g7-internal:
        aliases: [candystore-app]
    restart: unless-stopped

  candystore-daprd:
    # Dapr sidecar delivering bloodbank.evt.> to candystore (crib verbatim:
    # g1/dapr/pubsub.yaml; durableName candystore-events, queueGroupName
    # candystore, streamName BLOODBANK_EVENTS). No healthcheck on purpose —
    # daprd is distroless; readiness verified via :3500/v1.0/healthz.
    image: ${GOD_DAPRD_IMAGE:-daprio/daprd:1.13.0}
    command:
      - ./daprd
      - --app-id=candystore
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --app-port=3001
      - --app-channel-address=candystore-app
      - --app-protocol=http
      - --resources-path=/components
      - --placement-host-address=dapr-placement:50005
      - --log-level=info
    volumes:
      - type: bind
        source: ./dapr/pubsub.yaml
        target: /components/pubsub.yaml
        read_only: true
    depends_on:
      nats-init:
        condition: service_completed_successfully
      candystore:
        condition: service_healthy
    networks: [g7-bus, g7-internal]
    mem_limit: 128m
    restart: unless-stopped

  dapr-placement:
    # Sidecar rendezvous (crib: g1 compose). daprd refuses to start against a
    # missing placement host even without actors.
    image: ${GOD_DAPR_PLACEMENT_IMAGE:-daprio/dapr:1.13.0}
    command: ["./placement", "--port", "50005"]
    networks: [g7-bus]
    mem_limit: 64m
    restart: unless-stopped

  # ------------------------------------------------------------- enricher ---
  enrichment:
    # ONE real pass: canonical bloodbank.evt.* -> typed extraction (side
    # table) -> derived canonical event (causationid = source id).
    build:
      context: ./enrichment
      args:
        GOD_PYTHON_IMAGE: ${GOD_PYTHON_IMAGE:-python:3.12-alpine}
    image: god-g7-enrichment:0.1
    environment:
      GOD_BUS_NATS_URL: ${GOD_BUS_NATS_URL:-nats://nats:4222}
      GOD_OUTBOX_STREAM: ${GOD_OUTBOX_STREAM:-BLOODBANK_EVENTS}
      GOD_CONSUME_STREAM: ${GOD_CONSUME_STREAM:-BLOODBANK_EVENTS}
      GOD_CONSUME_FILTER: bloodbank.evt.>
      APP_PORT: "8791"
      GOD_ENRICH_DB: /data/enrichment.db
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - enrichment-data:/data
    depends_on:
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    mem_limit: 96m
    cpus: 0.5
    networks: [g7-bus, g7-internal]
    restart: unless-stopped

  # ------------------------------------------------------ hindsight-bridge ---
  hindsight-bridge:
    # Pluggable external memory backends + client-owned LLM surface. EMPTY
    # GOD_LLM_* defaults => DEGRADED (keyword only) and healthy — see
    # healthz degraded_reason. Zero AAI anywhere.
    build:
      context: ./hindsight-bridge
      args:
        GOD_PYTHON_IMAGE: ${GOD_PYTHON_IMAGE:-python:3.12-alpine}
    image: god-g7-hindsight-bridge:0.1
    environment:
      GOD_BUS_NATS_URL: ${GOD_BUS_NATS_URL:-nats://nats:4222}
      GOD_CONSUME_STREAM: ${GOD_CONSUME_STREAM:-BLOODBANK_EVENTS}
      GOD_CONSUME_FILTER: bloodbank.evt.>
      GOD_MEMORY_BACKENDS: ${GOD_MEMORY_BACKENDS:-memory-reference=http://memory-reference:8792}
      GOD_LLM_BASE_URL: ${GOD_LLM_BASE_URL:-}
      GOD_LLM_API_KEY: ${GOD_LLM_API_KEY:-}
      GOD_LLM_EMBED_MODEL: ${GOD_LLM_EMBED_MODEL:-text-embedding-3-small}
      GOD_LLM_RERANK_MODEL: ${GOD_LLM_RERANK_MODEL:-}
      GOD_BRIDGE_PORT: "8790"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on: []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    mem_limit: 96m
    cpus: 0.5
    networks: [g7-bus, g7-internal]
    restart: unless-stopped

  # ------------------------------------------------------ memory-reference ---
  memory-reference:
    # REAL reference backend (SQLite FTS5) implementing the pluggable-backend
    # contract; a real hindsight server replaces it via GOD_MEMORY_BACKENDS.
    build:
      context: ./memory-reference
      args:
        GOD_PYTHON_IMAGE: ${GOD_PYTHON_IMAGE:-python:3.12-alpine}
    image: god-g7-memory-reference:0.1
    environment:
      GOD_MEMORY_DB: /data/memory.db
      GOD_MEMORY_PORT: "8792"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - memory-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    mem_limit: 96m
    cpus: 0.25
    networks: [g7-internal]
    restart: unless-stopped

  # ---------------------------------------------------------------- ntfy ----
  ntfy:
    # Optional notification transport (crib: g3 ntfy pattern). Disabled by
    # default; enable with --profile notify.
    image: ${GOD_NTFY_IMAGE:-binwiederhier/ntfy:v2.33.1}
    command: serve
    profiles: [notify]
    environment:
      NTFY_LISTEN_HTTP: ":80"
      NTFY_AUTH_DEFAULT_ACCESS: read-write
      NTFY_ENABLE_LOGIN: "false"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 12h
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:80/v1/health >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 5s
    mem_limit: 64m
    cpus: 0.25
    networks: [g7-internal]
    restart: unless-stopped
