global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Scrape Prometheus itself.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container metrics.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    scrape_interval: 15s

  # The smoke canary (stopped/started by the smoke to prove the alert path).
  - job_name: "canary"
    static_configs:
      - targets: ["canary:8791"]
    metrics_path: /metrics
    scrape_interval: 5s
