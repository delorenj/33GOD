apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: bloodbank-pubsub
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - name: natsURL
      value: "nats://nats:4222"
    - name: name
      value: "bloodbank-pubsub"
    - name: durableName
      value: "enricher-events"
    - name: queueGroupName
      value: "enricher"
    - name: streamName
      value: "BLOODBANK_EVENTS"
    - name: deliverPolicy
      value: "new"
    # Each event waits on an LLM slop classification (~1-2 s). With the default
    # 1000 in flight and a 30 s ackWait, most of the window expired before the
    # enricher reached it and JetStream redelivered it: a redelivery storm that
    # grew the backlog (2026-10-22). Keep in-flight near what the app can work
    # and give each message time to finish.
    - name: ackWait
      value: "300s"
    - name: maxAckPending
      value: "32"
