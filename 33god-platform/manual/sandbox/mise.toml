[tools]
node = "24"

[tasks.dev]
description = "Run the factory sandbox with hot reload"
run = "npm run dev"

[tasks.assets]
description = "Build the Factory floor's 3D assets (src/assets/<id>/build.py, forge/fixture) into public/assets/ with Blender; only stale glbs rebuild. Args: --force, --only id,id, --strict"
run = "node tools/assets/build.mjs"

[tasks.build]
description = "Build the assets, typecheck and build into ../books/sandbox (served live at manual.delo.sh/sandbox/)"
depends = ["assets"]
run = "npm ci --silent && npm run build"

[tasks.deploy]
description = "Same as build: nginx bind-mounts ../books, so a build is a deploy"
depends = ["build"]

[tasks.narrate]
description = "Render waybill narration (Voxxy voice kurzgesagt) into public/voice/; args: waybill files/URLs, --print, --dry-run, --force"
run = "node --import ./tools/waybill/register.mjs --experimental-strip-types tools/waybill/narrate.ts"
