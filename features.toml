# 33GOD feature catalog: the full set of features in the pipeline.
#
# Load the `33god-features` skill before editing. Decisions (operator, 2026-11-06):
#   F1  Every feature is tracked in a formal repo (own GitHub repo, .project.json,
#       Plane board, BMAD, registered with pj, a 33GOD submodule). Crank dogfoods it.
#   F2  This file is the catalog and the planning map, read or not. An install or
#       container turns features off in its own untracked override,
#       ~/.config/33god/features.toml:   [disable]  crank = "reason"
#       Missing override = everything on.
#   F3  Features track main. No version ranges. A pin is a temporary bandage with a
#       reason and an exit ticket (`pin = { ref, reason, ticket }`), never a home.
#
# status:  formal     own formal repo, feature.toml at its root
#          embedded   lives as a folder inside another repo (allowed only if the
#                     operator approves embedded features; see I-9 decisions)
#          scattered  pieces spread across repos and runtime dirs, no home
#          planned    named, not built
# `today` lists where the pieces live now; `repo` is the target home.
# `requires` names atoms (shared building blocks); owners are in [atoms] below.

schema = 1

# --- Atoms: one owner each. PROPOSED owners await operator approval (I-9). -----
# A non-owner may serve an atom only as `provisional` until the owner's interface
# exists and passes a live differential against it.
[atoms]
"pane.topology"    = { owner = "zellij-driver", state = "proposed", provisional = "pjangler: pj crank panes --json" }
"zellij.invoke"    = { owner = "zellij-driver", state = "proposed" }
"tab.focus"        = { owner = "zellij-driver", state = "proposed" }
"tab.rename"       = { owner = "zellij-driver", state = "proposed" }
"pane.input"       = { owner = "zellij-driver", state = "proposed" }
"agent.process"    = { owner = "asm", state = "proposed", provisional = "pjangler: pj crank panes --json" }
"agent.identity"   = { owner = "asm", state = "proposed", today = "bloodbank services/agent-hooks/core/asm.py" }
"agent.session"    = { owner = "asm", state = "proposed", provisional = "pjangler: pj crank panes --json" }
"agent.state"      = { owner = "asm", state = "proposed", today = "bloodbank services/agent-hooks/core/asm.lua" }
"agent.attention"  = { owner = "asm", state = "proposed" }
"agent.hooks"      = { owner = "bloodbank", state = "owned", interface = "hooks.master.json + sync.py --check" }
"project.identity" = { owner = "pjangler", state = "owned", interface = "registry :8764 (/v1/resolve planned)" }
"agent.job"        = { owner = "hermes-agent", state = "owned" }
"clock"            = { owner = "candybar", state = "owned", interface = ".candybars/*.candybar.toml" }
"crank.binding"    = { owner = "crank", state = "proposed", note = "keyed by agent session (cli + session id); pane looked up live" }

