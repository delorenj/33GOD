# 33GOD feature catalog: the full set of features in the pipeline.
#
# Load the `33god-features` skill before editing. Decisions (2026-11-06, clarified 2026-11-07):
#   F1  Single-repo functionality is a component. A capability spanning repos and
#       becoming hard to maintain/extend is a feature candidate. A promoted
#       feature has its own formal repo as the tracked integration hub; participant
#       implementations stay in their component owners. Crank dogfoods it.
#   F2  This file is the catalog and the planning map, read or not. An install or
#       container turns features off in its own untracked override,
#       ~/.config/33god/features.toml:   [disable]  crank = "reason"
#       Missing override = everything on.
#   F3  Features track main. No version ranges. A pin is a temporary bandage with a
#       reason and an exit ticket (`pin = { ref, reason, ticket }`), never a home.
#
# status:  formal     promoted feature with a dedicated hub repo and feature.toml
#          embedded   candidate implementation currently inside a component repo
#          scattered  pieces spread across repos and runtime dirs, no home
#          planned    named, not built
# [feature.*] = promoted; [candidate.*] = inventory, not authorization to create a
# new repo. Candidate `repo` fields from the initial survey are hypothetical.
# `today` lists current homes; promoted `repo` is the authoritative hub.
# Approved atom ownership is distinct from deployment: `approved` means the target
# owner is decided, not that its API is installed. `owned` means current ownership.
# `requires` names atoms (shared building blocks); owners are in [atoms] below.

schema = 1

# --- Atoms: one owner each. ASM / terminal split approved 2026-11-07 (I-9). ----
# A non-owner may serve an atom only as `provisional` until the owner's interface
# exists and passes a live differential against it.
[atoms]
"pane.topology"    = { owner = "terminal-driver", state = "approved", provisional = "pjangler: pj crank panes --json" }
"zellij.invoke"    = { owner = "terminal-driver", state = "approved" }
"tab.focus"        = { owner = "terminal-driver", state = "approved" }
"tab.rename"       = { owner = "terminal-driver", state = "approved" }
"pane.input"       = { owner = "terminal-driver", state = "approved" }
"agent.process"    = { owner = "asm", state = "approved", provisional = "pjangler: pj crank panes --json" }
"agent.identity"   = { owner = "asm", state = "approved", today = "bloodbank services/agent-hooks/core/asm.py" }
"agent.session"    = { owner = "asm", state = "approved", provisional = "pjangler: pj crank panes --json" }
"agent.state"      = { owner = "asm", state = "approved", today = "bloodbank services/agent-hooks/core/asm.lua" }
"agent.attention"  = { owner = "asm", state = "approved" }
"agent.hooks"      = { owner = "bloodbank", state = "owned", interface = "hooks.master.json + sync.py --check" }
"project.identity" = { owner = "pjangler", state = "owned", interface = "registry :8764 (/v1/resolve planned)" }
"agent.job"        = { owner = "hermes-agent", state = "owned" }
"clock"            = { owner = "candybar", state = "owned", interface = ".candybars/*.candybar.toml" }
"crank.binding"    = { owner = "crank", state = "approved", provisional = "pjangler: src/crank/binding.ts (pj crank attach|detach|reap; Candybar rows tagged crank-session)", note = "keyed by agent session (cli + session id + pid/start); pane is location only; ends with the session (2026-11-18, PJAN-214)" }

