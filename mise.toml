# 33GOD — mise.toml
# ═══════════════════════════════════════════════════════════
[env]
_.path = [".mise/scripts", "agents/hermes/pm", "agents/hermes/pm/hermes"]
_.file = [".env"]
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[hooks]
enter = [
  "{{config_root}}/.mise/scripts/link-agentfiles.sh",
  "op inject -i .env.op > .env",
  "codegraph sync",
]

[tasks."platform:validate"]
description = "Validate the 33GOD product control-plane manifests and changelog"
run = "python3 33god-platform/scripts/platform.py validate"

[tasks."platform:components"]
description = "List productized 33GOD platform components"
run = "python3 33god-platform/scripts/platform.py components list"

[tasks."platform:backfills:check"]
description = "Read-only scan for known legacy 33GOD platform drift"
run = "python3 33god-platform/scripts/platform.py backfills check"

[tasks."platform:compose:render"]
description = "Render the default integrated local Compose model as JSON"
run = "docker compose -f 33god-platform/compose.yaml config --no-env-resolution --format json"

[tasks."platform:compose:render:tools"]
description = "Render the local model with one-shot PJangler tools as JSON"
run = "docker compose -f 33god-platform/compose.yaml --profile tools config --no-env-resolution --format json"

[tasks."platform:compose:render:full"]
description = "Render the full local model as JSON"
run = "docker compose -f 33god-platform/compose.yaml --profile full config --no-env-resolution --format json"

[tasks."platform:compose:render:cloud"]
description = "Render the explicitly unsupported cloud model as JSON"
run = "docker compose -f 33god-platform/compose.yaml --profile cloud config --no-env-resolution --format json"

[tasks."platform:compose:validate"]
description = "Render and semantically validate default, tools, full, and cloud Compose models"
run = "python3 33god-platform/scripts/validate-compose.py --source-root \"${GOD_SOURCE_ROOT:-.}\""

[tasks."platform:compose:test"]
description = "Run focused integrated Compose semantic-gate tests"
run = "python3 -m unittest discover -s 33god-platform/tests -p 'test_*.py' -v"

[tasks."docs:drift"]
description = "Read-only parity check for four-part BMAD docs and live contracts"
run = "python3 scripts/check-doc-drift.py --source-root \"${GOD_SOURCE_ROOT:-.}\" --docs-root ."

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link-agentfiles"

[tasks.link-agentfiles]
description = "Symlink all agent files to AGENTS.md"
run = "{{config_root}}/.mise/scripts/link-agentfiles.sh"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "{{config_root}}/.mise/scripts/versioning.sh current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "{{config_root}}/.mise/scripts/versioning.sh bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "{{config_root}}/.mise/scripts/versioning.sh bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "{{config_root}}/.mise/scripts/versioning.sh bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "{{config_root}}/.mise/scripts/versioning.sh check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "{{config_root}}/.mise/scripts/versioning.sh sync"
# <<< mise-versioning <<<
